name: Discover English Exam 1447 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-english-exam-1447.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'

permissions:
  contents: write

concurrency:
  group: discover-english-exam-1447
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id da6fc228-1ada-4627-8306-80d9d3401490

      - name: Discover source-local boundary candidates and render complete visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/english-exam-1447
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id da6fc228-1ada-4627-8306-80d9d3401490 \
            --visual-dir artifacts/english-exam-1447

      - name: Validate discovery evidence
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/technical/da6fc228-1ada-4627-8306-80d9d3401490.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/da6fc228-1ada-4627-8306-80d9d3401490-discovery.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          sid='da6fc228-1ada-4627-8306-80d9d3401490'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text(encoding='utf-8'))
          c=t['checks']
          assert c['manifest_image_count']==42
          assert c['existing_files']==c['readable_images']==c['byte_size_matches']==c['sha256_matches']==c['mime_matches']==42
          assert c['failures']==0 and t['all_images_technically_verified'] is True
          d=json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{sid}-discovery.json').read_text(encoding='utf-8'))
          assert d['counts']['pages']==42
          print('ENGLISH_1447_DISCOVERY_VERIFY_PASS')
          PY

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: english-exam-1447-boundary-evidence
          path: |
            artifacts/english-exam-1447/
            content-staging/reconstruction/technical/da6fc228-1ada-4627-8306-80d9d3401490.json
            content-staging/reconstruction/exams/source-groups/da6fc228-1ada-4627-8306-80d9d3401490-discovery.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit discovery evidence
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/da6fc228-1ada-4627-8306-80d9d3401490.json \
            content-staging/reconstruction/exams/source-groups/da6fc228-1ada-4627-8306-80d9d3401490-discovery.json
          if git diff --cached --quiet; then
            echo 'Discovery reports unchanged.'
            exit 0
          fi
          git commit -m 'content: discover english 1447 exam boundary candidates [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
