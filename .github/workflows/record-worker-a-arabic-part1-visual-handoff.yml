name: Record Arabic visual handoff
'on':
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - .github/workflows/record-worker-a-arabic-part1-visual-handoff.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - name: Record
        env:
          NOTE_B64: 
        run: |
          set -euo pipefail
          git pull --ff-only origin content/corpus-inventory-20260914
          printf '%s' "$NOTE_B64" | base64 -d >> content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: hand off Arabic part 1 visual evidence'
          git pull --rebase origin content/corpus-inventory-20260914
          git push origin HEAD:content/corpus-inventory-20260914
