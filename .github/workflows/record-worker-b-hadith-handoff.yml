name: Record Worker B Hadith Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-b-hadith-handoff.yml'

permissions:
  contents: write

concurrency:
  group: record-worker-b-hadith-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update shared baton from live repository truth
        run: python content-staging/tools/record_worker_b_hadith_handoff.py
      - name: Re-fetch live branch before shared-log write and fail closed on conflict
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          LIVE=$(git rev-parse origin/content/corpus-inventory-20260914)
          LOCAL=$(git rev-parse HEAD)
          test "$LIVE" = "$LOCAL" || { echo "Shared-log safety gate: branch changed live=$LIVE local=$LOCAL"; exit 24; }
      - name: Commit Worker B handoff
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git commit -m 'content: hand off Hadith completion to Worker A [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
