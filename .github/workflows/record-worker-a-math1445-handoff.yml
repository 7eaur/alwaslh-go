name: Record Worker A Math 1445 Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-a-math1445-handoff.yml'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Re-fetch live head before shared-log mutation
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "${GITHUB_SHA}" || { echo SHARED_LOG_LIVE_HEAD_DRIFT_FAIL_CLOSED; exit 41; }

      - name: Update active checkpoint and append Worker A run
        env:
          START_HEAD: ffaac8bb65705533bded9b634164ede2b6923905
          VERIFIED_END_HEAD: fb8aa7338e10e9286f804466cbfde01c8d205333
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          ROOT=Path('.')
          LOG=ROOT/'content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md'
          MASTER=ROOT/'content-staging/manifests/MASTER_CONTENT_MANIFEST.json'
          SID='0d4fa9fd-a93c-4d18-9dea-6dd22eb2e199'
          SNAME='الرياضيات نماذج وزارية 1445'
          m=json.loads(MASTER.read_text(encoding='utf-8')); sources=m['sources']; p=m['reconstruction_progress']
          def processed(s):
              x=str(s.get('review_status') or '')
              return x.startswith('processed_') or x=='reconstructed_verified'
          idx=next(i for i,s in enumerate(sources) if s['id']==SID)
          nxt=None
          for x in sources[idx+1:]+sources[:idx]:
              if not processed(x): nxt=x; break
          if not nxt: raise SystemExit('No next unprocessed source resolved')
          nid=nxt['id']; nname=(nxt.get('legacy_source') or {}).get('name') or 'NOT VERIFIED'
          manpath=ROOT/(nxt.get('manifest_path') or f'content-staging/raw/legacy-supabase/subjects/{nid}/manifest.json')
          nm=json.loads(manpath.read_text(encoding='utf-8'))
          c=nm.get('counts') or {}; an=nm.get('anomalies') or {}
          baseline=f"{c.get('pages','NOT VERIFIED')} pages, {c.get('images_downloaded',c.get('image_references','NOT VERIFIED'))} images, {c.get('questions','NOT VERIFIED')} legacy questions, {c.get('image_download_failures','NOT VERIFIED')} download failures; manifest anomalies preserved: {json.dumps(an,ensure_ascii=False,sort_keys=True)}"
          is_exam=('نماذج' in nname) or nxt.get('classification')=='exam_source_group'
          if is_exam:
              operation=f"Re-fetch live HEAD and baton; confirm no active/running workflow for {nid}; read its live manifest/pages; technically verify immutable RAW; scan duplicates and numbering; generate ordered boundary evidence; resolve Individual Exam Models/correction or Answer-Key evidence only from `{nname}` itself; structurally map legacy questions only where membership is proven; quarantine uncertainty as review_required/NOT VERIFIED; assert the 25,755 invariant; checkpoint and continue."
          else:
              operation=f"Re-fetch live HEAD and baton; confirm no active/running workflow for {nid}; read its live manifest/pages; technically verify immutable RAW; establish exact source identity from source-local/proven master evidence; reconstruct Book/Unit/Lesson/page boundaries without inherited assumptions; isolate review/non-lesson ambiguity; structurally map questions only where page membership is proven; assert the 25,755 invariant; checkpoint and continue."
          checkpoint=f'''## 10. ACTIVE CHECKPOINT

- state: `READY_FOR_NEXT_SOURCE`
- branch: `content/corpus-inventory-20260914`
- latest verified work HEAD before this handoff commit: `{os.environ['VERIFIED_END_HEAD']}`
- last completed source: `{SID} — {SNAME}`
- current source: `{nid} — {nname}`
- current source baseline from live manifest: `{baseline}`
- current operation: `{operation}`
- next source: `Resolve from live MASTER_CONTENT_MANIFEST only after {nname} is safely finalized.`
- blockers: `none at handoff; Mathematics 1445 pages 40..42 remain explicitly quarantined review_required inside the completed source and must not be silently merged/renumbered later.`
- owner decision required now: `no`
'''
          text=LOG.read_text(encoding='utf-8')
          pat=r'## 10\. ACTIVE CHECKPOINT\n.*?\n---\n'
          if len(re.findall(pat,text,flags=re.S))!=1: raise SystemExit('ACTIVE CHECKPOINT marker mismatch')
          text=re.sub(pat,checkpoint+'\n---\n',text,count=1,flags=re.S)
          now=datetime.now(timezone(timedelta(hours=3))).isoformat(timespec='seconds')
          run=f'''\n## RUN {now} — Worker A

- state: COMPLETE
- start HEAD: `{os.environ['START_HEAD']}`
- end HEAD: `{os.environ['VERIFIED_END_HEAD']}`
- phase: `CONTENT RECONSTRUCTION + EXAM BOUNDARY DISCOVERY`
- source at start: `{SID} — {SNAME}`
- completed in this run:
  - verified Worker B's Fiqh handoff against the live branch and continued exactly from Mathematics 1445;
  - technically verified all **42/42** immutable RAW images with existence/readability/byte-size/SHA-256/MIME checks and contiguous page sequence 1..42;
  - generated source-local discovery/contact-sheet evidence and complete metadata/provenance evidence;
  - established explicit three-page metadata blocks for models 1..13 on pages 1..39;
  - detected a second distinct-binary occurrence on pages 40..42 that repeats the model-12 labels and performed derived pixel comparisons against pages 34..36;
  - failed closed on semantic identity of that repeated label: finalized models 1..13 / pages 1..39 and quarantined pages 40..42 as `review_required` rather than merging or renumbering them;
  - structurally linked **28/28** legacy questions to verified model 1 because all 28 occur on page 1; semantic question correctness remains `NOT VERIFIED`;
  - updated final reconstruction, MASTER manifest and reconstruction/status/handoff/inventory/validation/import/continuation files through exact-head guarded finalization;
  - finalization invariant and live-head gates passed.
- evidence produced/verified:
  - `content-staging/reconstruction/technical/{SID}.json` — 42/42 technical PASS;
  - `content-staging/reconstruction/exams/source-groups/{SID}-discovery.json` — source-local discovery/contact sheets generated;
  - `content-staging/reconstruction/exams/source-groups/{SID}-metadata-evidence.json` — exact titles/provenance and question placement;
  - `content-staging/reconstruction/exams/source-groups/{SID}-repeated-label-evidence.json` — pages 34..36 vs 40..42 derived-pixel comparison, semantic identity `NOT VERIFIED`;
  - `content-staging/reconstruction/exams/source-groups/{SID}.json` — 13 verified models, 39 finalized exam pages, 3 review-required pages;
  - GitHub Actions discovery runs `34855070932`, `34855530204` and safe finalization run `34855799041` completed successfully.
- ambiguity/review_required:
  - pages 40..42 repeat source labels for model 12 but are non-identical binaries; whether they are the same semantic exam, an alternate version, or a mislabeled separate model is `NOT VERIFIED`; all three remain quarantined;
  - standalone official Answer Keys: `NOT VERIFIED`; correction pages are candidates only;
  - semantic correctness of legacy AI questions: `NOT VERIFIED`.
- invariant result: PASS
- Sources processed: {p['sources_completed']}/58
- Educational: {p.get('educational_sources_completed',0)}/26
- Books / Units / Lessons / Lesson Pages: {p.get('books_completed',10)} / {p.get('units_completed',33)} / {p.get('lessons_completed',196)} / {p.get('lesson_pages_completed',877)}
- Exam Source Groups: {p['exam_source_groups_completed']}/32
- Individual Exam Models: {p['individual_exam_models']}
- Exam Pages: {p['exam_pages_completed']}/2,286
- Verified Answer Keys: 0
- Source images technical: {p['source_images_technically_verified']}/5,273
- WebP generated / accepted / rejected: 0 / 0 / 0
- Legacy Questions: 25,755
- Lesson-linked: {p.get('lesson_linked_structural',0)}
- Exam-linked: {p.get('exam_linked_to_individual_model',0)}
- Review-required: {p.get('review_required',0)}
- Unclassified: {p.get('unclassified',0)}
- Duplicate groups classified: {p.get('duplicate_fingerprint_groups_classified',0)}/99
- RAW mutations: 0
- Unrelated mutations: 0
- New imports: 0
- New publications: 0
- last completed source: `{SID} — {SNAME}`
- current source: `{nid} — {nname}`
- exact next operation: `{operation}`
- next source: `Resolve only after the current source is safely finalized.`
- blockers: `none for forward progress; the isolated Mathematics 1445 repeated-label block remains review_required by design.`
- handoff note: `Worker B must re-fetch live HEAD and this baton, verify the Mathematics 1445 reconstruction/status counters, then start {nid} from its own evidence. Do not reopen pages 40..42 merely to force a model count, and do not inherit Mathematics 1445 boundaries into the next source.`
'''
          LOG.write_text(text.rstrip()+'\n'+run+'\n',encoding='utf-8')
          print(json.dumps({'next_source_id':nid,'next_source_name':nname,'baseline':baseline,'progress':p},ensure_ascii=False))
          PY

      - name: Re-fetch live head immediately before baton commit
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "${GITHUB_SHA}" || { echo SHARED_LOG_STALE_HEAD_FAIL_CLOSED; exit 42; }

      - name: Commit shared baton only
        run: |
          set -euo pipefail
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git diff --cached --exit-code --quiet && { echo 'No baton change'; exit 1; } || true
          git commit -m 'content: hand off Math 1445 completion to Worker B [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
