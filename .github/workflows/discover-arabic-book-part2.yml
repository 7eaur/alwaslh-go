name: Discover Arabic Book Part 2
on:
  push:
    branches: [content/corpus-inventory-20260914]
    paths: ['.github/workflows/discover-arabic-book-part2.yml']
permissions:
  contents: write
jobs:
  reconcile-question-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - name: Exact-head startup gate
        shell: bash
        run: |
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)"
      - name: Derive immutable question-membership evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          sid='7ddec20e-617e-4e55-bba8-2d371aaf16b6'
          root=pathlib.Path('content-staging/raw/legacy-supabase/subjects')/sid
          pages=json.loads((root/'pages.json').read_text())
          manifest=json.loads((root/'manifest.json').read_text())
          rows=[]; total=0
          for p in pages:
              qs=p.get('ai_questions') or []
              if not qs: continue
              qrows=[]
              for i,q in enumerate(qs):
                  canonical=json.dumps(q,ensure_ascii=False,sort_keys=True,separators=(',',':'))
                  qrows.append({'ordinal':i+1,'question_id':q.get('id') if isinstance(q,dict) else None,'sha256':hashlib.sha256(canonical.encode()).hexdigest()})
              rows.append({'legacy_page_id':p['id'],'stored_page_number':p.get('page_number'),'title':p.get('title'),'question_count':len(qs),'questions':qrows})
              total += len(qs)
          if total != 11 or manifest['counts']['questions'] != 11:
              raise SystemExit(f'QUESTION_COUNT_GATE_FAIL total={total} manifest={manifest["counts"]["questions"]}')
          out={'source_id':sid,'scope':'immutable_legacy_question_page_membership_evidence','source_of_truth':'content-staging/raw/legacy-supabase/subjects/'+sid+'/pages.json','records_with_questions':len(rows),'legacy_questions':total,'memberships':rows,'semantic_correctness':'NOT VERIFIED','lesson_or_assessment_mapping':'NOT VERIFIED pending boundary reconciliation','raw_mutations':0,'new_imports':0,'new_publications':0}
          path=pathlib.Path('content-staging/reconstruction/educational')/f'{sid}-question-membership-evidence.json'
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'records_with_questions':len(rows),'legacy_questions':total,'pages':[r['stored_page_number'] for r in rows]},ensure_ascii=False))
          PY
      - name: Pre-write live-head gate
        shell: bash
        run: |
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)"
      - name: Commit evidence only
        shell: bash
        run: |
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/reconstruction/educational/7ddec20e-617e-4e55-bba8-2d371aaf16b6-question-membership-evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'content: map Arabic part 2 legacy question page evidence [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
