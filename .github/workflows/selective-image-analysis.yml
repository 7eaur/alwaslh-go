name: Selective Image Analysis

on:
  push:
    branches:
      - content/selective-image-analysis-20260914
    paths:
      - 'content-staging/tools/selective_image_analysis.py'
      - '.github/workflows/selective-image-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Run technical scan and build selective review queue
        run: |
          python content-staging/tools/selective_image_analysis.py
      - name: Commit scan reports and visual overviews
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content-staging/reports/selective-image-analysis
          if git diff --cached --quiet; then
            echo 'No report changes.'
            exit 0
          fi
          git commit -m 'reports(content): verify images and build selective review queue'
          git push
