name: Discover English Exam 1445 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-english-exam-1445.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'

permissions:
  contents: write

concurrency:
  group: discover-english-exam-1445
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id 8489a487-91d9-47fb-80b8-35d0e7a074a4

      - name: Discover source-local boundary candidates and render full visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/english-exam-1445
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 8489a487-91d9-47fb-80b8-35d0e7a074a4 \
            --visual-dir artifacts/english-exam-1445

      - name: Validate discovery evidence
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/technical/8489a487-91d9-47fb-80b8-35d0e7a074a4.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4-discovery.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('content-staging/reconstruction/technical/8489a487-91d9-47fb-80b8-35d0e7a074a4.json').read_text(encoding='utf-8'))
          d = json.loads(Path('content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4-discovery.json').read_text(encoding='utf-8'))
          c = t['checks']
          assert c['manifest_image_count'] == 30
          assert c['existing_files'] == 30
          assert c['readable_images'] == 30
          assert c['byte_size_matches'] == 30
          assert c['sha256_matches'] == 30
          assert c['mime_matches'] == 30
          assert c['failures'] == 0
          assert t['all_images_technically_verified'] is True
          assert d['counts']['pages'] == 30
          assert d['counts']['questions'] == 0
          assert d['page_sequence']['first'] == 1 and d['page_sequence']['last'] == 30
          assert d['page_sequence']['count'] == 30 and d['page_sequence']['contiguous'] is True
          assert d['raw_mutations'] == 0
          print('ENGLISH_1445_DISCOVERY_VERIFY_PASS')
          PY

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: english-exam-1445-boundary-evidence
          path: |
            artifacts/english-exam-1445/
            content-staging/reconstruction/technical/8489a487-91d9-47fb-80b8-35d0e7a074a4.json
            content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4-discovery.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit discovery reports
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/8489a487-91d9-47fb-80b8-35d0e7a074a4.json \
            content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4-discovery.json
          if git diff --cached --quiet; then
            echo 'Discovery reports unchanged.'
            exit 0
          fi
          git commit -m 'content: discover english 1445 exam boundaries [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
