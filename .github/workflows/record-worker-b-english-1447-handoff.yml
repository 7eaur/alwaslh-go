name: Record Worker B English 1447 Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-b-english-1447-handoff.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record verified handoff
        run: python content-staging/tools/record_worker_b_english_1447_handoff.py
      - name: Validate handoff invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text())
          p=m['reconstruction_progress']
          assert p['correction_sheet_candidates']==140
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          t=Path('content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md').read_text()
          assert '## RUN 2026-09-14T12:14:00+03:00 — Worker B' in t
          assert '0a76f44b-0a4f-4e36-9ea9-badecf78bf23 — التاريخ الكتاب المدرسي' in t
          print('WORKER_B_ENGLISH_1447_HANDOFF_VERIFY_PASS')
          PY
      - name: Commit handoff
        run: |
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/manifests/MASTER_CONTENT_MANIFEST.json content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git commit -m 'docs: hand off english 1447 to history [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
