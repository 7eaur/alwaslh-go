---'''
          pat=r'## 10\. ACTIVE CHECKPOINT\n.*?\n---'
          new,n=re.subn(pat,active,text,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'ACTIVE CHECKPOINT replacement count {n}')
          run='''

## RUN 2026-09-15T00:45:00+03:00 — Worker A

- state: COMPLETE
- start HEAD: `e5557a2a2659b442972af7932f9922556fbccb76`
- end HEAD before handoff-log commit: `5ae76c89cb74828c9d446f7224202ca048433300`
- phase: `CONTENT RECONSTRUCTION + EXAM BOUNDARY DISCOVERY`
