- exact next operation: `Re-fetch live HEAD/baton; verify no active Mathematics 1445 workflow; technically verify all 42 images; inspect complete ordered visual evidence and source metadata to discover model/correction boundaries without inheriting prior patterns; map 28 questions only to proven model membership; preserve unsupported Answer Keys and semantics as NOT VERIFIED/review_required; assert global invariant and checkpoint.`
