name: Record Worker A Physics Handoff V2

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-a-physics-handoff-v2.yml'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Gate exact live head before handoff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)"

      - name: Prepare handoff
        run: python content-staging/tools/record_worker_a_physics_handoff.py

      - name: Recheck live head before shared write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)"

      - name: Commit handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md content-staging/CONTENT_REBUILD_HANDOFF.md content-staging/CONTENT_INVENTORY.md content-staging/CONTENT_VALIDATION_REPORT.md content-staging/CONTENT_IMPORT_REPORT.md content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          git commit -m 'content: hand off Physics 1445 to Worker B [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
