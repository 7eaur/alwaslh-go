name: Verify Chemistry Source Media

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/verify-chemistry-media.yml'
      - 'content-staging/tools/verify_subject_media.py'

permissions:
  contents: write

concurrency:
  group: verify-chemistry-source-media
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify Chemistry RAW media without mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id f0c5228c-7d5b-4ec2-85ed-ce59139ce0a4

      - name: Commit derived technical report
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/reconstruction/technical/f0c5228c-7d5b-4ec2-85ed-ce59139ce0a4.json
          if git diff --cached --quiet; then
            echo 'Derived report unchanged.'
            exit 0
          fi
          git commit -m 'content: verify chemistry source media [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
