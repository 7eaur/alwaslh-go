name: Record Worker B Math Part 1 Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-b-math-part1-handoff.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fail closed on live head drift
        run: |
          set -euo pipefail
          LIVE=$(git ls-remote origin refs/heads/content/corpus-inventory-20260914 | cut -f1)
          test "$LIVE" = "$GITHUB_SHA" || { echo "HEAD_DRIFT before handoff live=$LIVE expected=$GITHUB_SHA"; exit 41; }
      - name: Update ACTIVE CHECKPOINT and append Worker B RUN
        run: |
          python - <<'PY'
          import json,re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root=Path('content-staging')
          logp=root/'CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md'
          master=json.loads((root/'manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          prog=master['reconstruction_progress']
          current_id='b80cbba1-410a-4346-9446-c3f01c4f9e56'
          current=next(x for x in master['sources'] if x['id']==current_id)
          idx=next(i for i,x in enumerate(master['sources']) if x['id']==current_id)
          nxt=master['sources'][idx+1] if idx+1<len(master['sources']) else None
          current_name=current['legacy_source']['name']
          next_desc=f"{nxt['id']} — {nxt['legacy_source']['name']}" if nxt else 'NOT YET RESOLVED'
          man=json.loads((root/f'raw/legacy-supabase/subjects/{current_id}/manifest.json').read_text(encoding='utf-8'))
          counts=man['counts']; anomalies=man['anomalies']
          baseline=f"{counts['pages']} pages, {counts['images_downloaded']} images, {counts['questions']} legacy questions, {counts['image_download_failures']} download failures; anomaly arrays preserved: {json.dumps(anomalies,ensure_ascii=False,sort_keys=True)}"
          active=f'''## 10. ACTIVE CHECKPOINT

- state: `READY_NEXT_SOURCE`
- branch: `content/corpus-inventory-20260914`
- latest evidence HEAD before this handoff tooling: `f1202fbeedd500fc0d8fc2676b92485a46bf0570`
- last completed source: `1933807f-4cb0-40c9-9b29-3ef3d32c98dc — كتاب الرياضيات - الجزء الأول`
- current source: `{current_id} — {current_name}`
- current source baseline from live manifest: `{baseline}`
- current source verified work: `NOT STARTED in this handoff. No structural assumptions inherited from Part 1.`
- current operation: `Re-fetch live HEAD and this baton; confirm no active/running workflow for {current_id}; technically verify all {counts['images_downloaded']} immutable RAW images first; establish Part 2 identity and Unit/Lesson/non-lesson boundaries only from its own deterministic evidence; because this source has 0 legacy questions, do not invent question mappings; preserve any ambiguity as NOT VERIFIED/review_required; checkpoint only after page classification and invariants pass.`
- next source: `{next_desc}`
- blockers: `none for handoff; Part 2 technical/identity/structure evidence is NOT VERIFIED until Worker A inspects it.`
- owner decision required now: `no; continue source-by-source fail-closed`
'''
          text=logp.read_text(encoding='utf-8')
          pattern=r'## 10\. ACTIVE CHECKPOINT\n.*?\n---\n\n### Shared handoff rule'
          replacement=active.rstrip()+"\n---\n\n### Shared handoff rule"
          text2,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'ACTIVE CHECKPOINT replace count={n}')
          ts=datetime.now(ZoneInfo('Asia/Riyadh')).replace(microsecond=0).isoformat()
          run=f'''\n\n## RUN {ts} — Worker B

- state: COMPLETE
- start HEAD: `6ed3971e2e2edfd276368f7ebf55f39d33a96610`
- end HEAD before handoff-log tooling: `f1202fbeedd500fc0d8fc2676b92485a46bf0570`
- phase: `CONTENT RECONSTRUCTION + EXAM BOUNDARY DISCOVERY`
- source at start: `1933807f-4cb0-40c9-9b29-3ef3d32c98dc — كتاب الرياضيات - الجزء الأول`
- completed in this run:
  - verified Worker A's blocker against live HEAD/evidence and preserved the rejected master reference as rejected;
  - generated complete occurrence-safe RAW contact sheets and inspected all 186 pages without transferring structure from the rejected master;
  - established 4 visual unit boundaries, 21 source-local lesson runs, 162 lesson pages, and 24 proven non-lesson pages (2 review, 18 general-exercise, 4 unit-test);
  - analyzed all 717 legacy questions: 620 occur on proven lesson pages and were structurally lesson-linked; 97 occur on proven non-lesson pages and were conservatively marked review_required;
  - reran 186/186 immutable RAW technical verification and finalized the educational reconstruction;
  - updated MASTER_CONTENT_MANIFEST and status/handoff/inventory/validation/import/continuation evidence docs;
  - guarded finalization passed three live-HEAD gates and the global question invariant.
- evidence produced/verified:
  - technical report: `content-staging/reconstruction/technical/1933807f-4cb0-40c9-9b29-3ef3d32c98dc.json`;
  - final reconstruction: `content-staging/reconstruction/educational/1933807f-4cb0-40c9-9b29-3ef3d32c98dc.json`;
  - RAW contact-sheet run `34866261877`, artifact digest `sha256:d0809a083d82ceccfdddaecaa757b53503fbc28ef4a23b542a31f894a8bf866b`;
  - structure-analysis run `34866749562`: 717 total = 620 lesson-page + 23 review-page + 62 general-exercise-page + 12 unit-test-page questions;
  - finalization run `34867041504`: `MATH_PART1_RECONSTRUCTION_VERIFY_PASS` + `MATH_PART1_FINALIZATION_VERIFY_PASS`;
  - canonical evidence commit: `f1202fbeedd500fc0d8fc2676b92485a46bf0570`.
- ambiguity/review_required:
  - rejected reference `الرياضيات ثالث ثانوي/02_الرياضيات_ثالث_ثانوي` remains unusable for identity/structure: 0/186 exact SHA; expected-position unique visual nearest match 1/186;
  - 97 questions on non-lesson review/exercise/test pages are `review_required`, not forced into lessons;
  - semantic correctness of all legacy AI questions remains `NOT VERIFIED`.
- invariant result: PASS
- Sources processed: {prog['sources_completed']}/58
- Educational: {prog['educational_sources_completed']}/26
- Books / Units / Lessons / Lesson Pages: {prog['verified_books']} / {prog['verified_units']} / {prog['verified_lessons']} / {prog['verified_lesson_pages']}
- Exam Source Groups: {prog['exam_source_groups_completed']}/32
- Individual Exam Models: {prog['individual_exam_models']}
- Exam Pages: {prog['finalized_exam_pages']}/2,286
- Verified Answer Keys: 0
- Source images technical: {prog['source_images_technically_verified']}/5,273
- WebP generated / accepted / rejected: 0 / 0 / 0
- Legacy Questions: 25,755
- Lesson-linked: {prog['lesson_linked_structural']}
- Exam-linked: {prog['exam_linked_to_individual_model']}
- Review-required: {prog['review_required']}
- Unclassified: {prog['unclassified']}
- Duplicate groups classified: 0/99
- RAW mutations: {prog['raw_mutations']}
- Unrelated mutations: {prog['unrelated_mutations']}
- New imports: {prog['new_imports']}
- New publications: {prog['new_publications']}
- last completed source: `1933807f-4cb0-40c9-9b29-3ef3d32c98dc — كتاب الرياضيات - الجزء الأول`
- current source: `{current_id} — {current_name}`
- exact next operation: `Technically verify 135/135 Part 2 RAW images, inspect source-local identity/title evidence and complete visual boundaries, reconstruct its own Units/Lessons/non-lesson pages without inheriting Part 1 structure, assert 0-question accounting and global invariant, then checkpoint and continue.`
- next source: `{next_desc}`
- blockers: `none`
- handoff note: `Worker A must start Part 2 from its live manifest/RAW. Do not assume Part 1's 4 units, page ranges, lesson count, or rejected master behavior applies to Part 2. There are 0 legacy questions in Part 2 baseline, so no question mappings should be invented.`
'''
          logp.write_text(text2.rstrip()+run+'\n',encoding='utf-8')
          print(json.dumps({'timestamp':ts,'current':current_id,'current_name':current_name,'next':next_desc,'baseline':counts},ensure_ascii=False))
          PY
      - name: Final live-head gate and commit baton only
        run: |
          set -euo pipefail
          LIVE=$(git ls-remote origin refs/heads/content/corpus-inventory-20260914 | cut -f1)
          test "$LIVE" = "$GITHUB_SHA" || { echo "HEAD_DRIFT before baton commit live=$LIVE expected=$GITHUB_SHA"; exit 42; }
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git diff --cached --quiet && { echo 'No baton changes'; exit 43; }
          git commit -m 'content: hand off Math Part 2 to Worker A [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
