name: Finalize Mathematics Exam 1446 Reconstruction

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/finalize-math-exam-1446.yml'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Fail closed on live-head drift before finalization
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "${GITHUB_SHA}" || { echo LIVE_HEAD_DRIFT_FAIL_CLOSED; exit 41; }
      - name: Re-verify immutable media
        run: python content-staging/tools/verify_subject_media.py --subject-id 85c13f3f-fe85-47c3-affb-fb437d10d908
      - name: Reconstruct Math 1446 from occurrence-safe evidence
        run: python content-staging/tools/reconstruct_math_exam_1446.py
      - name: Record master/status checkpoint
        run: python content-staging/tools/record_math_exam_1446_checkpoint.py
      - name: Verify reconstruction and global invariant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sid='85c13f3f-fe85-47c3-affb-fb437d10d908'
          r=json.loads((Path('content-staging/reconstruction/exams/source-groups')/f'{sid}.json').read_text(encoding='utf-8'))
          m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          p=m['reconstruction_progress']; s=next(x for x in m['sources'] if x['id']==sid)
          assert r['individual_exam_model_count']==13
          assert r['finalized_exam_page_count']==39 and r['review_required_page_count']==0
          assert r['source_numbering_anomalies']['duplicate_page_numbers']==[16,29]
          assert r['question_mapping']['exam_linked_structural']==25
          assert s['review_status']=='processed_boundary_verified_numbering_anomalies_preserved_answer_keys_not_verified'
          assert s['exam_reconstruction']['duplicate_page_numbers_preserved']==[16,29]
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          assert p['raw_mutations']==p['unrelated_mutations']==p['new_imports']==p['new_publications']==0
          print('MATH_1446_FINALIZATION_VERIFY_PASS')
          print(json.dumps(p,ensure_ascii=False))
          PY
      - name: Re-fetch live head before finalization write
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "${GITHUB_SHA}" || { echo LIVE_HEAD_DRIFT_FAIL_CLOSED; exit 42; }
      - name: Commit evidence-backed finalization
        run: |
          set -euo pipefail
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/reconstruction/technical/85c13f3f-fe85-47c3-affb-fb437d10d908.json content-staging/reconstruction/exams/source-groups/85c13f3f-fe85-47c3-affb-fb437d10d908.json content-staging/manifests/MASTER_CONTENT_MANIFEST.json content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md content-staging/CONTENT_REBUILD_HANDOFF.md content-staging/CONTENT_INVENTORY.md content-staging/CONTENT_VALIDATION_REPORT.md content-staging/CONTENT_IMPORT_REPORT.md content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          git diff --cached --quiet && exit 43 || true
          git commit -m 'content: finalize Math 1446 reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
