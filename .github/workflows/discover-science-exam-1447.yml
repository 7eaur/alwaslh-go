name: Discover Science Exam 1447 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-science-exam-1447.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'
      - 'content-staging/tools/inspect_science_exam_1447_anomaly.py'
      - 'content-staging/tools/reconstruct_science_exam_1447.py'
      - 'content-staging/tools/record_science_exam_1447_checkpoint.py'

permissions:
  contents: write

concurrency:
  group: discover-science-exam-1447
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id 14ef15e0-5524-473a-bbdb-996df35ba535

      - name: Discover source-local boundary candidates and render complete visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/science-exam-1447
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 14ef15e0-5524-473a-bbdb-996df35ba535 \
            --visual-dir artifacts/science-exam-1447

      - name: Record duplicate-page-number anomaly identities
        run: |
          set -euo pipefail
          python content-staging/tools/inspect_science_exam_1447_anomaly.py

      - name: Reconstruct verified Science 1447 exam boundaries and question mappings
        run: |
          set -euo pipefail
          python content-staging/tools/reconstruct_science_exam_1447.py

      - name: Record source-group checkpoint
        run: |
          set -euo pipefail
          python content-staging/tools/record_science_exam_1447_checkpoint.py

      - name: Validate finalized reconstruction and global invariant
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/exams/source-groups/14ef15e0-5524-473a-bbdb-996df35ba535.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          source = '14ef15e0-5524-473a-bbdb-996df35ba535'
          r = json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{source}.json').read_text(encoding='utf-8'))
          assert r['source_pages'] == 42
          assert r['source_questions'] == 262
          assert r['source_blocks_reviewed'] == 14
          assert r['verified_source_occurrence_count'] == 14
          assert r['review_required_block_count'] == 0
          assert r['individual_exam_model_count'] == 14
          assert r['finalized_exam_page_count'] == 42
          assert r['review_required_page_count'] == 0
          assert r['correction_sheet_candidate_count'] == 14
          assert r['verified_answer_key_count'] == 0
          assert r['duplicate_sha256_groups_within_source'] == 0
          assert r['source_numbering_anomalies']['missing_page_numbers'] == [35]
          assert r['source_numbering_anomalies']['duplicate_page_numbers'] == [36]
          assert r['source_numbering_anomalies']['raw_or_metadata_rewrite_performed'] is False
          m12 = r['models'][11]
          assert m12['question_record_ids'] == ['d37e4aea-1164-46c9-a52e-99f71c3da511', 'e5be5a57-1052-4193-b525-ffa11912a6b2']
          assert m12['correction_sheet_candidate_record_id'] == '4e7b1edf-37cf-44d1-9801-091a396a86b0'
          q = r['question_mapping']
          assert q['exam_linked_structural'] == 262
          assert q['review_required'] == 0
          assert q['unassigned_within_source'] == 0
          assert len(q['records']) == 262
          assert r['evidence']['raw_mutations'] == 0
          m = json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          p = m['reconstruction_progress']
          assert p['lesson_linked_structural'] + p['exam_linked_to_individual_model'] + p['review_required'] + p['unclassified'] == 25755
          assert p['sources_completed'] == 7
          assert p['exam_source_groups_completed'] == 6
          assert p['individual_exam_models'] == 99
          assert p['exam_pages_completed'] == 347
          assert p['source_images_technically_verified'] == 533
          assert p['exam_linked_to_individual_model'] == 733
          assert p['review_required'] == 351
          assert p['unclassified'] == 22446
          assert p['raw_mutations'] == 0 and p['unrelated_mutations'] == 0 and p['new_imports'] == 0 and p['new_publications'] == 0
          print('SCIENCE_1447_FINALIZATION_VERIFY_PASS')
          print(json.dumps({'source_exam_linked': q['exam_linked_structural'], 'global_progress': p}, ensure_ascii=False))
          PY

      - name: Upload finalized boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-1447-boundary-evidence-final
          path: |
            artifacts/science-exam-1447/
            content-staging/reconstruction/technical/14ef15e0-5524-473a-bbdb-996df35ba535.json
            content-staging/reconstruction/exams/source-groups/14ef15e0-5524-473a-bbdb-996df35ba535-discovery.json
            content-staging/reconstruction/exams/source-groups/14ef15e0-5524-473a-bbdb-996df35ba535-anomaly-evidence.json
            content-staging/reconstruction/exams/source-groups/14ef15e0-5524-473a-bbdb-996df35ba535.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit finalized reconstruction checkpoint
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/14ef15e0-5524-473a-bbdb-996df35ba535.json \
            content-staging/reconstruction/exams/source-groups/14ef15e0-5524-473a-bbdb-996df35ba535-discovery.json \
            content-staging/reconstruction/exams/source-groups/14ef15e0-5524-473a-bbdb-996df35ba535-anomaly-evidence.json \
            content-staging/reconstruction/exams/source-groups/14ef15e0-5524-473a-bbdb-996df35ba535.json \
            content-staging/manifests/MASTER_CONTENT_MANIFEST.json \
            content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md \
            content-staging/CONTENT_REBUILD_HANDOFF.md \
            content-staging/CONTENT_INVENTORY.md \
            content-staging/CONTENT_VALIDATION_REPORT.md \
            content-staging/CONTENT_IMPORT_REPORT.md \
            content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          if git diff --cached --quiet; then
            echo 'Derived reports unchanged.'
            exit 0
          fi
          git commit -m 'content: finalize science 1447 exam reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
