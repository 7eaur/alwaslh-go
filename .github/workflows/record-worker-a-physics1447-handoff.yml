          src=next(s for s in master['sources'] if s.get('id')==sid); nxt=next(s for s in master['sources'] if s.get('id')==next_sid)
          if src.get('review_status')!='processed_boundary_verified_answer_keys_not_verified': raise SystemExit('Physics 1447 not canonically processed')
