name: Finalize Biology Exam 1447 Reconstruction

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/finalize-biology-exam-1447.yml'
      - 'content-staging/tools/finalize_biology_exam_1447.py'

permissions:
  contents: write

concurrency:
  group: finalize-biology-exam-1447
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Gate exact live head before finalization
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo 'LIVE_HEAD_DRIFT_BEFORE_FINALIZATION'; exit 42; }

      - name: Reverify immutable RAW and regenerate discovery evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/biology-exam-1447-final
          python content-staging/tools/verify_subject_media.py --subject-id 3df6f57e-26cb-414e-97c5-ef6bd2ff4487
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 3df6f57e-26cb-414e-97c5-ef6bd2ff4487 \
            --visual-dir artifacts/biology-exam-1447-final

      - name: Reconstruct verified Biology 1447 boundaries
        run: |
          set -euo pipefail
          python content-staging/tools/finalize_biology_exam_1447.py

      - name: Validate final reconstruction and global invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sid='3df6f57e-26cb-414e-97c5-ef6bd2ff4487'
          r=json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{sid}.json').read_text(encoding='utf-8'))
          assert r['source_pages']==124 and r['source_questions']==50
          assert r['source_blocks_reviewed']==31 and r['verified_source_occurrence_count']==29
          assert r['review_required_block_count']==2
          assert r['individual_exam_model_count']==28 and r['finalized_exam_page_count']==116
          assert r['review_required_page_count']==8
          assert r['correction_sheet_candidate_count']==29 and r['verified_answer_key_count']==0
          assert r['duplicate_sha256_groups_within_source']==9
          q=r['question_mapping']
          assert q['exam_linked_structural'] + q['review_required'] == 50
          assert q['unassigned_within_source']==0 and len(q['records'])==50
          assert r['evidence']['raw_mutations']==0
          m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          p=m['reconstruction_progress']
          assert p['lesson_linked_structural'] + p['exam_linked_to_individual_model'] + p['review_required'] + p['unclassified'] == 25755
          assert p['raw_mutations']==0 and p['unrelated_mutations']==0 and p['new_imports']==0 and p['new_publications']==0
          assert p['sources_completed']==31 and p['exam_source_groups_completed']==16
          assert p['individual_exam_models']==279 and p['exam_pages_completed']==944 and p['source_images_technically_verified']==2484
          print('BIOLOGY_1447_FINALIZATION_VERIFY_PASS')
          print(json.dumps({'source_question_mapping':q, 'global_progress':p},ensure_ascii=False))
          PY

      - name: Gate exact live head before evidence write
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo 'LIVE_HEAD_DRIFT_BEFORE_EVIDENCE_WRITE'; exit 42; }

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: biology-exam-1447-final-evidence
          path: |
            artifacts/biology-exam-1447-final/
            content-staging/reconstruction/technical/3df6f57e-26cb-414e-97c5-ef6bd2ff4487.json
            content-staging/reconstruction/exams/source-groups/3df6f57e-26cb-414e-97c5-ef6bd2ff4487-discovery.json
            content-staging/reconstruction/exams/source-groups/3df6f57e-26cb-414e-97c5-ef6bd2ff4487.json
          if-no-files-found: error
          retention-days: 14

      - name: Gate exact live head before canonical commit
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo 'LIVE_HEAD_DRIFT_BEFORE_CANONICAL_COMMIT'; exit 42; }

      - name: Commit canonical evidence
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/3df6f57e-26cb-414e-97c5-ef6bd2ff4487.json \
            content-staging/reconstruction/exams/source-groups/3df6f57e-26cb-414e-97c5-ef6bd2ff4487-discovery.json \
            content-staging/reconstruction/exams/source-groups/3df6f57e-26cb-414e-97c5-ef6bd2ff4487.json \
            content-staging/manifests/MASTER_CONTENT_MANIFEST.json \
            content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md \
            content-staging/CONTENT_REBUILD_HANDOFF.md \
            content-staging/CONTENT_INVENTORY.md \
            content-staging/CONTENT_VALIDATION_REPORT.md \
            content-staging/CONTENT_IMPORT_REPORT.md \
            content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          if git diff --cached --quiet; then echo 'Derived evidence unchanged.'; exit 0; fi
          git commit -m 'content: finalize biology 1447 exam reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
