name: Discover Math Book Part 1

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-math-book-part1.yml'
      - 'content-staging/tools/discover_math_book_part1.py'

permissions:
  contents: write

concurrency:
  group: discover-math-book-part1
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Checkout trusted master reference
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-reference
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify immutable RAW media
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py --subject-id 1933807f-4cb0-40c9-9b29-3ef3d32c98dc

      - name: Discover exact-master identity evidence
        run: |
          set +e
          python content-staging/tools/discover_math_book_part1.py
          echo "discovery_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Commit derived discovery evidence before semantic gate
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/reconstruction/technical/1933807f-4cb0-40c9-9b29-3ef3d32c98dc.json content-staging/reconstruction/educational/1933807f-4cb0-40c9-9b29-3ef3d32c98dc-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: record Math Part 1 discovery evidence [skip ci]'
            git push origin HEAD:content/corpus-inventory-20260914
          fi

      - name: Assert non-destructive discovery gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sid='1933807f-4cb0-40c9-9b29-3ef3d32c98dc'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text())
          d=json.loads(Path(f'content-staging/reconstruction/educational/{sid}-discovery.json').read_text())
          assert t['all_images_technically_verified'] is True
          assert t['checks']['manifest_image_count']==186
          assert d['raw_image_count']==186
          assert d['legacy_question_count']==717
          assert d['raw_mutations']==0
          assert d['structure_status']=='DISCOVERY_ONLY'
          if d['identity_status']!='VERIFIED':
              raise SystemExit(f"FAIL_CLOSED identity_status={d['identity_status']} exact={d['exact_sha_identity_count']}/186 failures={len(d['identity_failures'])}")
          assert d['exact_sha_identity_count']==186
          assert d['matched_source_page_min']==8 and d['matched_source_page_max']==193
          print('MATH_BOOK_PART1_DISCOVERY_PASS')
          PY
