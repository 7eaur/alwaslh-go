'''
          baton.write_text(text.rstrip()+run+'\n',encoding='utf-8')
          print('WORKER_B_FIQH_HANDOFF_PREPARED', now)
          PY
      - name: Re-fetch live branch immediately before shared-log commit
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          LIVE=$(git rev-parse origin/content/corpus-inventory-20260914)
          LOCAL=$(git rev-parse HEAD)
