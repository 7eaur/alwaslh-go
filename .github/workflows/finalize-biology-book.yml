name: Finalize Biology Book

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/finalize-biology-book.yml'
      - 'content-staging/tools/reconstruct_biology_book.py'
      - 'content-staging/tools/record_biology_checkpoint.py'

permissions:
  contents: write

concurrency:
  group: finalize-biology-book
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Gate exact live head before finalization
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo 'LIVE_HEAD_DRIFT_BEFORE_FINALIZATION'; exit 42; }

      - name: Checkout trusted master reference
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-reference
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Reverify source and exact identity
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py --subject-id 67d4ffae-68e1-42e8-9c3b-72329973c93d
          python content-staging/tools/discover_biology_book.py

      - name: Reconstruct verified biology structure
        run: |
          set -euo pipefail
          python content-staging/tools/reconstruct_biology_book.py

      - name: Record corpus checkpoint
        run: |
          set -euo pipefail
          python content-staging/tools/record_biology_checkpoint.py

      - name: Verify final invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sid='67d4ffae-68e1-42e8-9c3b-72329973c93d'
          r=json.loads(Path(f'content-staging/reconstruction/educational/{sid}.json').read_text())
          m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text())
          p=m['reconstruction_progress']
          assert r['status']=='reconstructed_verified'
          assert r['reconstructed_book']['unit_count']==8
          assert r['reconstructed_book']['lesson_count']==47
          assert r['reconstructed_book']['lesson_page_count']==193
          assert r['reconstructed_book']['unit_cover_page_count']==8
          assert r['reconstructed_book']['unit_review_page_count']==13
          assert r['questions']['structurally_lesson_linked_questions']+r['questions']['review_required_questions']==3304
          assert p['sources_completed']==28 and p['educational_sources_completed']==15
          assert p['verified_books']==13 and p['verified_units']==48 and p['verified_lessons']==283 and p['verified_lesson_pages']==1354
          assert p['source_images_technically_verified']==2200
          assert p['unclassified']==13360
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          assert p['raw_mutations']==0 and p['unrelated_mutations']==0 and p['new_imports']==0 and p['new_publications']==0
          print('BIOLOGY_FINALIZATION_VERIFY_PASS')
          PY

      - name: Re-fetch live branch before evidence commit
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo 'LIVE_HEAD_DRIFT_BEFORE_WRITE'; exit 42; }

      - name: Commit finalized reconstruction and checkpoint
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/67d4ffae-68e1-42e8-9c3b-72329973c93d.json \
            content-staging/reconstruction/educational/67d4ffae-68e1-42e8-9c3b-72329973c93d-discovery.json \
            content-staging/reconstruction/educational/67d4ffae-68e1-42e8-9c3b-72329973c93d.json \
            content-staging/manifests/MASTER_CONTENT_MANIFEST.json \
            content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md \
            content-staging/CONTENT_REBUILD_HANDOFF.md \
            content-staging/CONTENT_INVENTORY.md \
            content-staging/CONTENT_VALIDATION_REPORT.md \
            content-staging/CONTENT_IMPORT_REPORT.md \
            content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          if git diff --cached --quiet; then
            echo 'Finalized state unchanged.'
            exit 0
          fi
          git commit -m 'content: finalize biology book reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
