name: Discover Islamic Exam 1447 Evidence

on:
  push:
    branches: [content/corpus-inventory-20260914]
    paths:
      - '.github/workflows/discover-islamic-exam-1447.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'

permissions:
  contents: read

concurrency:
  group: discover-islamic-exam-1447
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify source-group media
        run: python content-staging/tools/verify_subject_media.py --subject-id f25891fe-ea52-481b-baf2-ff4764c79bde
      - name: Discover and render complete visual evidence
        run: |
          mkdir -p artifacts/islamic-exam-1447
          python content-staging/tools/discover_exam_source_group.py --subject-id f25891fe-ea52-481b-baf2-ff4764c79bde --visual-dir artifacts/islamic-exam-1447
      - name: Validate discovery-only evidence
        run: |
          python -m json.tool content-staging/reconstruction/technical/f25891fe-ea52-481b-baf2-ff4764c79bde.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/f25891fe-ea52-481b-baf2-ff4764c79bde-discovery.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          sid='f25891fe-ea52-481b-baf2-ff4764c79bde'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text())
          r=json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{sid}-discovery.json').read_text())
          c=t['checks']
          assert c['existing_files']==c['readable_images']==c['byte_size_matches']==c['sha256_matches']==c['mime_matches']==93
          assert r['counts']['pages']==93
          assert r['individual_exam_models']=='NOT VERIFIED'
          assert r['answer_keys']=='NOT VERIFIED'
          assert r['raw_mutations']==0
          print('ISLAMIC_1447_DISCOVERY_EVIDENCE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: islamic-exam-1447-discovery-evidence
          path: |
            artifacts/islamic-exam-1447/
            content-staging/reconstruction/technical/f25891fe-ea52-481b-baf2-ff4764c79bde.json
            content-staging/reconstruction/exams/source-groups/f25891fe-ea52-481b-baf2-ff4764c79bde-discovery.json
          if-no-files-found: error
          retention-days: 14
