name: Run Worker A Arabic Part1 Handoff
on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - .github/workflows/run-worker-a-arabic-part1-handoff.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - run: |
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)"
          python scripts/record_worker_a_arabic_part1_partial.py
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)"
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git commit -m "content: hand off Arabic book part 1 evidence [skip ci]"
          git push origin HEAD:content/corpus-inventory-20260914
