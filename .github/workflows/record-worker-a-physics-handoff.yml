name: Record Worker A Physics Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-a-physics-handoff.yml'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Gate exact live head before handoff generation
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo LIVE_HEAD_DRIFT_BEFORE_HANDOFF; exit 42; }

      - name: Update ACTIVE CHECKPOINT and append Worker A RUN
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          log=Path('content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md')
          text=log.read_text(encoding='utf-8')
          evidence_head='5ae76c89cb74828c9d446f7224202ca048433300'
          next_id='41e5a81c-3b93-479c-9b76-33815cae9430'
