name: Finalize Faith Book
on:
  push:
    branches: [content/corpus-inventory-20260914]
    paths:
      - '.github/workflows/finalize-faith-book.yml'
      - 'content-staging/tools/reconstruct_faith_book.py'
      - 'content-staging/tools/record_faith_book_checkpoint.py'
permissions:
  contents: write
concurrency:
  group: finalize-faith-book
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: content/corpus-inventory-20260914, fetch-depth: 0}
      - name: Reconstruct exact lesson membership
        run: python content-staging/tools/reconstruct_faith_book.py
      - name: Assert Faith reconstruction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sid='516f1c1d-acc0-4b1c-8e50-8f92a7c737e0'
          r=json.loads(Path(f'content-staging/reconstruction/educational/{sid}.json').read_text())
          assert r['status']=='reconstructed_verified_exact_sha_lesson_membership'
          assert r['source_identity']['exact_sha_matches']==65
          assert r['reconstructed_book']['lesson_count']==10
          assert r['reconstructed_book']['lesson_member_page_count']==65
          assert r['questions']['legacy_questions']==976
          assert r['questions']['structurally_lesson_linked_questions']==976
          assert r['questions']['semantic_correctness']=='NOT VERIFIED'
          assert r['invariants']['raw_mutations']==0 and r['invariants']['new_imports']==0 and r['invariants']['new_publications']==0
          print('FAITH_RECONSTRUCTION_VERIFY_PASS')
          PY
      - name: Re-fetch live branch before finalization and fail closed
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "$(git rev-parse HEAD)" || exit 23
      - name: Record evidence-backed checkpoint
        run: python content-staging/tools/record_faith_book_checkpoint.py
      - name: Assert global invariant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text())['reconstruction_progress']
          assert x['sources_completed']==16 and x['educational_sources_completed']==7 and x['verified_books']==7
          assert x['source_images_technically_verified']==1239
          assert x['lesson_linked_structural']==3350 and x['unclassified']==21087
          assert x['lesson_linked_structural']+x['exam_linked_to_individual_model']+x['review_required']+x['unclassified']==25755
          assert x['raw_mutations']==0 and x['unrelated_mutations']==0 and x['new_imports']==0 and x['new_publications']==0
          print('FAITH_FINALIZATION_VERIFY_PASS')
          PY
      - name: Re-fetch live branch immediately before write and fail closed
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "$(git rev-parse HEAD)" || exit 24
      - name: Commit Faith checkpoint
        run: |
          set -euo pipefail
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/reconstruction/educational/516f1c1d-acc0-4b1c-8e50-8f92a7c737e0.json content-staging/manifests/MASTER_CONTENT_MANIFEST.json content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md content-staging/CONTENT_REBUILD_HANDOFF.md content-staging/CONTENT_INVENTORY.md content-staging/CONTENT_VALIDATION_REPORT.md content-staging/CONTENT_IMPORT_REPORT.md content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          git commit -m 'content: finalize faith reconstruction checkpoint [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
