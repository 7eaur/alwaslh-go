name: Discover English Exam 1447 Boundaries

on:
  push:
    branches: [content/corpus-inventory-20260914]
    paths:
      - '.github/workflows/discover-english-exam-1447.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'
      - 'content-staging/tools/reconstruct_english_exam_1447.py'
      - 'content-staging/tools/record_english_exam_1447_checkpoint.py'

permissions:
  contents: write

concurrency:
  group: discover-english-exam-1447
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify source-group media
        run: python content-staging/tools/verify_subject_media.py --subject-id da6fc228-1ada-4627-8306-80d9d3401490
      - name: Discover and render complete visual evidence
        run: |
          mkdir -p artifacts/english-exam-1447
          python content-staging/tools/discover_exam_source_group.py --subject-id da6fc228-1ada-4627-8306-80d9d3401490 --visual-dir artifacts/english-exam-1447
      - name: Reconstruct anomaly-aware boundaries
        run: python content-staging/tools/reconstruct_english_exam_1447.py
      - name: Record checkpoint
        run: python content-staging/tools/record_english_exam_1447_checkpoint.py
      - name: Validate finalized reconstruction and global invariant
        run: |
          python -m json.tool content-staging/reconstruction/technical/da6fc228-1ada-4627-8306-80d9d3401490.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/da6fc228-1ada-4627-8306-80d9d3401490.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          sid='da6fc228-1ada-4627-8306-80d9d3401490'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text())
          r=json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{sid}.json').read_text())
          c=t['checks']
          assert c['existing_files']==c['readable_images']==c['byte_size_matches']==c['sha256_matches']==c['mime_matches']==42
          assert t['page_sequence']['missing_page_numbers']==[12,26,37]
          assert t['page_sequence']['duplicate_page_numbers']==[18,27,29]
          assert r['individual_exam_model_count']==13
          assert r['finalized_exam_page_count']==39 and r['review_required_page_count']==3
          assert r['correction_sheet_candidate_count']==14 and r['verified_answer_key_count']==0
          q=r['question_mapping']; assert q['exam_linked_structural']==234 and q['review_required']==0 and q['unassigned_within_source']==0 and len(q['records'])==234
          m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text())
          p=m['reconstruction_progress']
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          assert p['raw_mutations']==p['unrelated_mutations']==p['new_imports']==p['new_publications']==0
          print('ENGLISH_1447_FINALIZATION_VERIFY_PASS')
          print(json.dumps({'progress':p}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: english-exam-1447-boundary-evidence-final
          path: |
            artifacts/english-exam-1447/
            content-staging/reconstruction/technical/da6fc228-1ada-4627-8306-80d9d3401490.json
            content-staging/reconstruction/exams/source-groups/da6fc228-1ada-4627-8306-80d9d3401490-discovery.json
            content-staging/reconstruction/exams/source-groups/da6fc228-1ada-4627-8306-80d9d3401490.json
          if-no-files-found: error
          retention-days: 14
      - name: Commit finalized reconstruction checkpoint
        run: |
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/reconstruction/technical/da6fc228-1ada-4627-8306-80d9d3401490.json content-staging/reconstruction/exams/source-groups/da6fc228-1ada-4627-8306-80d9d3401490-discovery.json content-staging/reconstruction/exams/source-groups/da6fc228-1ada-4627-8306-80d9d3401490.json content-staging/manifests/MASTER_CONTENT_MANIFEST.json content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md content-staging/CONTENT_REBUILD_HANDOFF.md content-staging/CONTENT_INVENTORY.md content-staging/CONTENT_VALIDATION_REPORT.md content-staging/CONTENT_IMPORT_REPORT.md content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          if git diff --cached --quiet; then echo 'Derived reports unchanged.'; exit 0; fi
          git commit -m 'content: finalize english 1447 exam reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
