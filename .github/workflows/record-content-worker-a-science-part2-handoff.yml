name: Record Content Worker A Science Part 2 Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-content-worker-a-science-part2-handoff.yml'
      - 'content-staging/tools/record_content_worker_a_science_part2_handoff.py'

permissions:
  contents: write

concurrency:
  group: record-content-worker-a-science-part2-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update shared baton
        run: python content-staging/tools/record_content_worker_a_science_part2_handoff.py
      - name: Commit shared handoff
        run: |
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          if git diff --cached --quiet; then
            echo 'Shared handoff already current.'
            exit 0
          fi
          git commit -m 'docs: hand off after science part2 reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
