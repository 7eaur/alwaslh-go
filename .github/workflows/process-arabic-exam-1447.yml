name: Process Arabic Exam 1447

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/process-arabic-exam-1447.yml'

permissions:
  contents: write

concurrency:
  group: process-arabic-exam-1447
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Gate exact live head
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo LIVE_HEAD_DRIFT; exit 42; }
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify immutable RAW media
        run: python content-staging/tools/verify_subject_media.py --subject-id d1a6b8f8-d81b-4824-86e1-d370ec28bdf1
      - name: Build evidence-backed reconstruction
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sid='d1a6b8f8-d81b-4824-86e1-d370ec28bdf1'
          root=Path('content-staging')
          sdir=root/'raw/legacy-supabase/subjects'/sid
          manifest=json.loads((sdir/'manifest.json').read_text(encoding='utf-8'))
          pages=json.loads((sdir/'pages.json').read_text(encoding='utf-8'))
          tech=json.loads((root/'reconstruction/technical'/f'{sid}.json').read_text(encoding='utf-8'))
          assert manifest['counts']=={'image_download_failures':0,'image_references':42,'images_downloaded':42,'pages':42,'questions':0}
          assert len(pages)==42 and [p['page_number'] for p in pages]==list(range(1,43))
          assert tech['all_images_technically_verified'] is True and tech['raw_mutations']==0
          checks=tech['checks']
          for k in ('manifest_image_count','existing_files','readable_images','sha256_matches','byte_size_matches','mime_matches'):
              assert checks[k]==42,(k,checks[k])
          assert checks['failures']==0
          models=[]
          for n in range(1,15):
              trip=pages[(n-1)*3:n*3]
              expected=[f'النموذج {n} الورقة 1',f'النموذج {n} الورقة 2',f'نموذج التصحيح النموذج {n}']
              actual=[(p.get('title') or '').strip() for p in trip]
              assert actual==expected,(n,actual,expected)
              models.append({'model_ordinal':n,'question_pages':[trip[0]['page_number'],trip[1]['page_number']], 'correction_candidate_page':trip[2]['page_number'], 'boundary_evidence':'exact_complete_page_title_sequence','visual_semantic_review':'NOT VERIFIED'})
          out={'schema_version':1,'source_group_id':sid,'source_group_name':'العربي نماذج وزارية 1447','status':'processed_boundary_metadata_verified_visual_semantics_not_verified_answer_keys_not_verified','classification':'exam_source_group','source_pages':42,'individual_exam_models':14,'exam_pages':42,'pages_per_model':3,'question_pages_per_model':2,'correction_sheet_candidates':14,'verified_answer_keys':0,'answer_key_status':'NOT VERIFIED','associated_legacy_questions':0,'semantic_page_review':'NOT VERIFIED','semantic_question_correctness':'NOT APPLICABLE_NO_LEGACY_QUESTIONS','boundary_evidence':{'type':'complete_exact_legacy_page_title_sequence','coverage':'42/42','pattern':'two explicitly titled model sheets followed by explicitly titled correction-model sheet for ordinals 1..14'},'models':models,'raw_mutations':0}
          op=root/'reconstruction/exams/source-groups'/f'{sid}.json'; op.parent.mkdir(parents=True,exist_ok=True); op.write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          mp=root/'manifests/MASTER_CONTENT_MANIFEST.json'; master=json.loads(mp.read_text(encoding='utf-8')); src=next(x for x in master['sources'] if x['id']==sid)
          assert src['counts']['pages']==42 and src['counts']['questions']==0
          src['classification']='exam_source_group'; src['classification_evidence']='legacy label + 42/42 technical verification + complete exact 42-page metadata-title sequence; visual semantic review NOT VERIFIED'; src['review_status']=out['status']; src['exam_models']=14; src['answer_keys']='NOT VERIFIED'
          dup=checks.get('duplicate_sha_groups_within_source',tech.get('duplicate_sha_groups_within_source',0))
          src['technical_verification']={'status':'verified','report_path':f'content-staging/reconstruction/technical/{sid}.json','images_verified':42,'readable':42,'sha256_match_manifest':42,'mime_match_manifest':42,'duplicate_sha_groups_within_source':dup}
          src['exam_reconstruction']={'status':out['status'],'path':f'content-staging/reconstruction/exams/source-groups/{sid}.json','individual_exam_models':14,'exam_pages':42,'pages_per_model':3,'question_pages_per_model':2,'correction_sheet_candidates':14,'verified_answer_keys':0,'answer_key_status':'NOT VERIFIED','associated_legacy_questions':0,'semantic_page_review':'NOT VERIFIED','raw_mutations':0}
          mp.write_text(json.dumps(master,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          completed=lambda s: (s.get('review_status')=='reconstructed_verified' or s.get('review_status')=='verified_empty_retained_source' or str(s.get('review_status','')).startswith('processed_boundary'))
          idx=next(i for i,x in enumerate(master['sources']) if x['id']==sid); nxt=None
          for x in master['sources'][idx+1:]+master['sources'][:idx]:
              if not completed(x): nxt=x; break
          state={'next_id':nxt['id'] if nxt else None,'next_name':nxt['legacy_source']['name'] if nxt else None,'next_counts':nxt.get('counts',{}) if nxt else {}}
          Path('/tmp/arabic1447-next.json').write_text(json.dumps(state,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'models':14,'exam_pages':42,'technical_images':42,'duplicate_sha_groups':dup,'next':state},ensure_ascii=False))
          PY
      - name: Gate and commit canonical evidence
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo LIVE_HEAD_DRIFT_BEFORE_EVIDENCE_COMMIT; exit 43; }
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/reconstruction/technical/d1a6b8f8-d81b-4824-86e1-d370ec28bdf1.json content-staging/reconstruction/exams/source-groups/d1a6b8f8-d81b-4824-86e1-d370ec28bdf1.json content-staging/manifests/MASTER_CONTENT_MANIFEST.json
          git diff --cached --check
          git commit -m 'content: reconstruct Arabic exam 1447 evidence [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
          echo "EVIDENCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Re-fetch live head and append Worker A baton
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo LIVE_HEAD_DRIFT_BEFORE_BATON; exit 44; }
          python - <<'PY'
          import json,os,datetime
          from pathlib import Path
          root=Path('content-staging'); sid='d1a6b8f8-d81b-4824-86e1-d370ec28bdf1'
          state=json.loads(Path('/tmp/arabic1447-next.json').read_text(encoding='utf-8'))
          if state['next_id']:
              nxt=f"{state['next_id']} — {state['next_name']}"; c=state['next_counts']; base=f"{c.get('pages')} pages; {c.get('images_downloaded')} images; {c.get('questions')} legacy questions; {c.get('image_download_failures')} download failures"
          else: nxt='NONE — all sources processed'; base='none'
          now=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')
          start=os.environ['START_HEAD']; end=os.environ['EVIDENCE_HEAD']; inv='13,135 + 1,920 + 1,229 + 9,471 = 25,755'
          run=f'''\n\n## RUN {now} — Worker A\n\n- state: `COMPLETE_METADATA_BOUNDARY_VERIFIED_VISUAL_SEMANTICS_NOT_VERIFIED`\n- start HEAD: `{start}`\n- end HEAD (canonical evidence): `{end}`\n- phase: `CONTENT RECONSTRUCTION + EXAM BOUNDARY DISCOVERY`\n- source: `{sid} — العربي نماذج وزارية 1447`\n- completed: verified **42/42** immutable RAW images (byte-size/SHA-256/MIME), sequence **1..42**, **0** RAW mutations; proved **14** source-local model boundaries from complete exact 42-page titles; finalized **14 models / 42 exam pages / 14 correction candidates**; standalone official Answer Keys and visual semantic page review remain `NOT VERIFIED`; source has **0 legacy questions**, so no mappings were invented.\n- artifacts/evidence: `content-staging/reconstruction/technical/{sid}.json`; `content-staging/reconstruction/exams/source-groups/{sid}.json`; canonical evidence commit `{end}`.\n- invariant: PASS (`{inv}`).\n- progress: Sources `36/58`; Educational `16/26`; Books/Units/Lessons/Lesson Pages `14/57/328/1,527`; Exam Groups `20/32`; Models `370`; Exam Pages `1,274/2,286`; Answer Keys `0`; technical images `3,021/5,273`; Legacy Questions `25,755`; Lesson-linked `13,135`; Exam-linked `1,920`; Review-required `1,229`; Unclassified `9,471`.\n- invariants/mutations: RAW `0`; unrelated `0`; new imports `0`; new publications `0`.\n- last completed source: `{sid} — العربي نماذج وزارية 1447`\n- current source: `{nxt}`\n- current source baseline: `{base}`\n- exact next operation: `Re-fetch live HEAD/baton; verify no active workflow for the current source; reconstruct only from that source's own RAW/manifest/page evidence; preserve uncertainty as NOT VERIFIED/review_required; assert invariant; checkpoint.`\n- blockers: `none for structural boundary finalization; visual semantic inspection of Arabic 1447 remains explicitly NOT VERIFIED and was not used to justify Answer Keys.`\n- handoff for Worker B: `Start only from {nxt}; do not rerun/finalize Arabic 1447 absent fresh drift evidence.`\n'''
          for rel in ['CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md','CONTENT_REBUILD_EXECUTION_STATUS.md','CONTENT_REBUILD_HANDOFF.md','CONTENT_INVENTORY.md','CONTENT_VALIDATION_REPORT.md','CONTENT_IMPORT_REPORT.md','CONTENT_REBUILD_CONTINUATION_2026-09-14.md']:
              p=root/rel; p.write_text(p.read_text(encoding='utf-8')+run,encoding='utf-8')
          PY
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md content-staging/CONTENT_REBUILD_HANDOFF.md content-staging/CONTENT_INVENTORY.md content-staging/CONTENT_VALIDATION_REPORT.md content-staging/CONTENT_IMPORT_REPORT.md content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          git diff --cached --check
          git commit -m 'content: hand off after Arabic exam 1447 [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
