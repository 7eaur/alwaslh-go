name: Discover Science Exam 1446 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-science-exam-1446.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'
      - 'content-staging/tools/reconstruct_science_exam_1446.py'
      - 'content-staging/tools/record_science_exam_1446_checkpoint.py'

permissions:
  contents: write

concurrency:
  group: discover-science-exam-1446
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id 004c02be-3f55-49e1-bbdc-b0824491bd68

      - name: Discover source-local boundary candidates and render full visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/science-exam-1446
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 004c02be-3f55-49e1-bbdc-b0824491bd68 \
            --visual-dir artifacts/science-exam-1446

      - name: Reconstruct verified Science 1446 exam boundaries and question mappings
        run: |
          set -euo pipefail
          python content-staging/tools/reconstruct_science_exam_1446.py

      - name: Record source-group checkpoint
        run: |
          set -euo pipefail
          python content-staging/tools/record_science_exam_1446_checkpoint.py

      - name: Validate finalized reconstruction and global invariant
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/exams/source-groups/004c02be-3f55-49e1-bbdc-b0824491bd68.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('content-staging/reconstruction/exams/source-groups/004c02be-3f55-49e1-bbdc-b0824491bd68.json').read_text(encoding='utf-8'))
          assert r['source_pages'] == 39
          assert r['source_questions'] == 30
          assert r['source_blocks_reviewed'] == 13
          assert r['verified_source_occurrence_count'] == 13
          assert r['review_required_block_count'] == 0
          assert r['individual_exam_model_count'] == 13
          assert r['finalized_exam_page_count'] == 39
          assert r['review_required_page_count'] == 0
          assert r['correction_sheet_candidate_count'] == 13
          assert r['verified_answer_key_count'] == 0
          assert r['duplicate_sha256_groups_within_source'] == 0
          q = r['question_mapping']
          assert q['exam_linked_structural'] == 30
          assert q['review_required'] == 0
          assert q['unassigned_within_source'] == 0
          assert len(q['records']) == 30
          assert r['evidence']['raw_mutations'] == 0
          m = json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          p = m['reconstruction_progress']
          assert p['lesson_linked_structural'] + p['exam_linked_to_individual_model'] + p['review_required'] + p['unclassified'] == 25755
          assert p['raw_mutations'] == 0 and p['unrelated_mutations'] == 0 and p['new_imports'] == 0 and p['new_publications'] == 0
          print('SCIENCE_1446_FINALIZATION_VERIFY_PASS')
          print(json.dumps({'source_exam_linked': q['exam_linked_structural'], 'global_progress': p}, ensure_ascii=False))
          PY

      - name: Upload finalized boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-1446-boundary-evidence-final
          path: |
            artifacts/science-exam-1446/
            content-staging/reconstruction/technical/004c02be-3f55-49e1-bbdc-b0824491bd68.json
            content-staging/reconstruction/exams/source-groups/004c02be-3f55-49e1-bbdc-b0824491bd68-discovery.json
            content-staging/reconstruction/exams/source-groups/004c02be-3f55-49e1-bbdc-b0824491bd68.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit finalized reconstruction checkpoint
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/004c02be-3f55-49e1-bbdc-b0824491bd68.json \
            content-staging/reconstruction/exams/source-groups/004c02be-3f55-49e1-bbdc-b0824491bd68-discovery.json \
            content-staging/reconstruction/exams/source-groups/004c02be-3f55-49e1-bbdc-b0824491bd68.json \
            content-staging/manifests/MASTER_CONTENT_MANIFEST.json \
            content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md \
            content-staging/CONTENT_REBUILD_HANDOFF.md \
            content-staging/CONTENT_INVENTORY.md \
            content-staging/CONTENT_VALIDATION_REPORT.md \
            content-staging/CONTENT_IMPORT_REPORT.md \
            content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          if git diff --cached --quiet; then
            echo 'Derived reports unchanged.'
            exit 0
          fi
          git commit -m 'content: finalize science 1446 exam reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
