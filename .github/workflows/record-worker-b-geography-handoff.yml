name: Record Worker B Geography Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-b-geography-handoff.yml'

permissions:
  contents: write

concurrency:
  group: record-worker-b-geography-handoff
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Verify finalized Geography evidence and Faith baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sid='a7f1e94f-82d1-4146-af5b-4e9b51363f0b'
          nxt='516f1c1d-acc0-4b1c-8e50-8f92a7c737e0'
          r=json.loads(Path(f'content-staging/reconstruction/educational/{sid}.json').read_text())
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text())
          m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text())
          n=json.loads(Path(f'content-staging/raw/legacy-supabase/subjects/{nxt}/manifest.json').read_text())
          p=m['reconstruction_progress']
          assert r['status']=='reconstructed_verified'
          assert r['source_identity']['raw_master_exact_sha_matches']==104
          b=r['reconstructed_book']
          assert (b['unit_count'],b['lesson_count'],b['lesson_page_count'],b['unit_cover_page_count'],b['unit_review_page_count'],b['non_lesson_page_count'])==(4,18,94,4,6,0)
          assert t['all_images_technically_verified'] is True
          assert p['sources_completed']==15 and p['educational_sources_completed']==6
          assert p['verified_books']==6 and p['verified_units']==33
          assert p['verified_lessons']==151 and p['verified_lesson_pages']==602
          assert p['source_images_technically_verified']==1174
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          assert p['raw_mutations']==0 and p['unrelated_mutations']==0 and p['new_imports']==0 and p['new_publications']==0
          assert n['counts']['pages']==65 and n['counts']['image_references']==65
          assert n['counts']['questions']==976 and n['counts']['image_download_failures']==0
          assert all(not v for v in n['anomalies'].values())
          print('WORKER_B_GEOGRAPHY_EVIDENCE_PASS')
          PY

      - name: Re-fetch live HEAD before shared-log mutation
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)"

      - name: Record shared handoff
        run: python content-staging/tools/record_worker_b_geography_handoff.py

      - name: Verify handoff content
        run: |
          set -euo pipefail
          grep -F 'last completed source: `a7f1e94f-82d1-4146-af5b-4e9b51363f0b — كتاب الجغرافيا`' content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          grep -F 'current source: `516f1c1d-acc0-4b1c-8e50-8f92a7c737e0 — الإيمان الكتاب المدرسي`' content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          grep -F '2,374 + 967 + 351 + 22,063 = 25,755' content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          grep -F '## RUN 2026-09-14T14:02:00+03:00 — Worker B' content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md

      - name: Re-fetch live HEAD immediately before log commit
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)"

      - name: Commit shared baton
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          if git diff --cached --quiet; then
            echo 'Handoff already recorded.'
            exit 0
          fi
          git commit -m 'docs: checkpoint Worker B Geography completion [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
