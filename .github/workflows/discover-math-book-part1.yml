name: Discover Math Book Part 1

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-math-book-part1.yml'
      - 'content-staging/tools/discover_math_book_part1.py'
      - 'content-staging/tools/compare_math_book_part1_master.py'

permissions:
  contents: write

concurrency:
  group: discover-math-book-part1
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Checkout trusted master reference
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-reference
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify immutable RAW media
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py --subject-id 1933807f-4cb0-40c9-9b29-3ef3d32c98dc

      - name: Record exact-SHA identity evidence
        run: |
          set +e
          python content-staging/tools/discover_math_book_part1.py
          exit 0

      - name: Compare every RAW page against all master pages visually
        run: |
          set -euo pipefail
          python content-staging/tools/compare_math_book_part1_master.py

      - name: Commit derived discovery diagnostics
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/reconstruction/technical/1933807f-4cb0-40c9-9b29-3ef3d32c98dc.json content-staging/reconstruction/educational/1933807f-4cb0-40c9-9b29-3ef3d32c98dc-discovery.json content-staging/reconstruction/educational/1933807f-4cb0-40c9-9b29-3ef3d32c98dc-visual-identity-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: record Math Part 1 identity diagnostics [skip ci]'
            git push origin HEAD:content/corpus-inventory-20260914
          fi

      - name: Assert technical and diagnostic invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sid='1933807f-4cb0-40c9-9b29-3ef3d32c98dc'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text())
          d=json.loads(Path(f'content-staging/reconstruction/educational/{sid}-discovery.json').read_text())
          v=json.loads(Path(f'content-staging/reconstruction/educational/{sid}-visual-identity-diagnostic.json').read_text())
          assert t['all_images_technically_verified'] is True
          assert t['checks']['manifest_image_count']==186
          assert d['raw_image_count']==186 and d['legacy_question_count']==717
          assert d['raw_mutations']==0 and v['raw_mutations']==0
          assert v['raw_count']==186 and v['master_count']==255
          print('MATH_BOOK_PART1_DIAGNOSTIC_PASS', v['intended_unique_best_count'], v['best_mae_max'], v['best_margin_min'])
          PY
