name: Content Staging CI

on:
  push:
    branches:
      - content/legacy-staging-rebuild
    paths:
      - 'content-staging/**'
      - '.github/workflows/content-staging-ci.yml'
  pull_request:
    paths:
      - 'content-staging/**'
      - '.github/workflows/content-staging-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Compile staging tools
        run: python -m py_compile content-staging/tools/*.py
      - name: Run staging unit tests
        run: python -m unittest discover -s content-staging/tests -p 'test_*.py' -v
