name: Record Content Worker B Science Part 1 Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-content-worker-b-science-part1-handoff.yml'
      - 'content-staging/tools/record_content_worker_b_science_part1_handoff.py'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-handoff
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record handoff
        run: python content-staging/tools/record_content_worker_b_science_part1_handoff.py
      - name: Commit handoff
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          if git diff --cached --quiet; then
            echo 'Handoff already recorded.'
            exit 0
          fi
          git commit -m 'docs: hand off after science part1 reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
