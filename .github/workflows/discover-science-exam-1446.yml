name: Discover Science Exam 1446 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-science-exam-1446.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'

permissions:
  contents: read

concurrency:
  group: discover-science-exam-1446
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id 004c02be-3f55-49e1-bbdc-b0824491bd68

      - name: Discover source-local boundary candidates and render full visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/science-exam-1446
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 004c02be-3f55-49e1-bbdc-b0824491bd68 \
            --visual-dir artifacts/science-exam-1446

      - name: Validate technical discovery only
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/technical/004c02be-3f55-49e1-bbdc-b0824491bd68.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/004c02be-3f55-49e1-bbdc-b0824491bd68-discovery.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('content-staging/reconstruction/technical/004c02be-3f55-49e1-bbdc-b0824491bd68.json').read_text(encoding='utf-8'))
          c = t['checks']
          assert c['manifest_image_count'] == 39
          assert c['existing_files'] == 39
          assert c['readable_images'] == 39
          assert c['byte_size_matches'] == 39
          assert c['sha256_matches'] == 39
          assert c['mime_matches'] == 39
          assert c['failures'] == 0
          assert t['all_images_technically_verified'] is True
          assert t['page_sequence']['first_page_number'] == 1
          assert t['page_sequence']['last_page_number'] == 39
          assert t['page_sequence']['unique_page_numbers'] == 39
          assert t['page_sequence']['missing_page_numbers'] == []
          assert t['page_sequence']['duplicate_page_numbers'] == []
          assert t['raw_mutations'] == 0
          print('SCIENCE_1446_DISCOVERY_VERIFY_PASS')
          PY

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-1446-boundary-evidence
          path: |
            artifacts/science-exam-1446/
            content-staging/reconstruction/technical/004c02be-3f55-49e1-bbdc-b0824491bd68.json
            content-staging/reconstruction/exams/source-groups/004c02be-3f55-49e1-bbdc-b0824491bd68-discovery.json
          if-no-files-found: error
          retention-days: 14
