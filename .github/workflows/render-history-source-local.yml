name: Render History Source-Local Evidence

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/render-history-source-local.yml'
      - 'content-staging/tools/render_history_source_local_contact_sheets.py'

permissions:
  contents: write

concurrency:
  group: render-history-source-local
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Re-verify immutable History media
        run: python content-staging/tools/verify_subject_media.py --subject-id 0a76f44b-0a4f-4e36-9ea9-badecf78bf23

      - name: Render complete ordered contact sheets
        run: python content-staging/tools/render_history_source_local_contact_sheets.py

      - name: Assert rendering invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sid='0a76f44b-0a4f-4e36-9ea9-badecf78bf23'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text())
          v=json.loads(Path(f'content-staging/reconstruction/educational/{sid}-visual-index.json').read_text())
          assert t['all_images_technically_verified'] is True
          assert t['checks']['manifest_image_count']==61
          assert t['raw_mutations']==0
          assert v['raw_image_count']==61
          assert v['stored_page_range']==[8,68]
          assert v['contact_sheet_count']==6
          assert v['semantic_boundaries']=='NOT VERIFIED'
          assert v['raw_mutations']==0
          print('HISTORY_SOURCE_LOCAL_RENDER_PASS')
          PY

      - name: Commit machine-readable visual index only
        run: |
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/reconstruction/educational/0a76f44b-0a4f-4e36-9ea9-badecf78bf23-visual-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: record History source-local visual index [skip ci]'
            git push origin HEAD:content/corpus-inventory-20260914
          fi

      - name: Upload complete source-local visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: history-source-local-contact-sheets
          path: _artifacts/history-source-local/*.jpg
          if-no-files-found: error
          retention-days: 7
