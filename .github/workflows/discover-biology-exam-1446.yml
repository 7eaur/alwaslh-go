name: Discover Biology Exam 1446 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-biology-exam-1446.yml'

permissions:
  contents: read

concurrency:
  group: discover-biology-exam-1446
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id 62d827b3-8ab6-4c2b-8ff2-de6156947276

      - name: Discover source-local boundary candidates and render full visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/biology-exam-1446
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 62d827b3-8ab6-4c2b-8ff2-de6156947276 \
            --visual-dir artifacts/biology-exam-1446

      - name: Validate source-local discovery only
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/technical/62d827b3-8ab6-4c2b-8ff2-de6156947276.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/62d827b3-8ab6-4c2b-8ff2-de6156947276-discovery.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          sid='62d827b3-8ab6-4c2b-8ff2-de6156947276'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text(encoding='utf-8'))
          d=json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{sid}-discovery.json').read_text(encoding='utf-8'))
          c=t['checks']
          assert t['all_images_technically_verified'] is True
          assert c['manifest_image_count'] == 100
          assert c['existing_files'] == 100
          assert c['readable_images'] == 100
          assert c['sha256_matches'] == 100
          assert c['byte_size_matches'] == 100
          assert c['mime_matches'] == 100
          assert c['failures'] == 0
          assert t['raw_mutations'] == 0
          assert d['counts']['pages'] == 100
          assert d['counts']['images_downloaded'] == 100
          assert d['counts']['image_download_failures'] == 0
          assert d['counts']['questions'] == 200
          assert d['raw_mutations'] == 0
          print('BIOLOGY_1446_DISCOVERY_VERIFY_PASS')
          PY

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: biology-exam-1446-discovery-evidence
          path: |
            artifacts/biology-exam-1446/
            content-staging/reconstruction/technical/62d827b3-8ab6-4c2b-8ff2-de6156947276.json
            content-staging/reconstruction/exams/source-groups/62d827b3-8ab6-4c2b-8ff2-de6156947276-discovery.json
          if-no-files-found: error
          retention-days: 14
