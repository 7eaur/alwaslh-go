name: Discover Science Exam 1445 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-science-exam-1445.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'

permissions:
  contents: write

concurrency:
  group: discover-science-exam-1445
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id ef408805-c337-44dd-b903-7838030e6de0

      - name: Discover source-local boundary candidates and render full visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/science-exam-1445
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id ef408805-c337-44dd-b903-7838030e6de0 \
            --visual-dir artifacts/science-exam-1445

      - name: Validate discovery evidence only
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/technical/ef408805-c337-44dd-b903-7838030e6de0.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/ef408805-c337-44dd-b903-7838030e6de0-discovery.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          tech = json.loads(Path('content-staging/reconstruction/technical/ef408805-c337-44dd-b903-7838030e6de0.json').read_text(encoding='utf-8'))
          disc = json.loads(Path('content-staging/reconstruction/exams/source-groups/ef408805-c337-44dd-b903-7838030e6de0-discovery.json').read_text(encoding='utf-8'))
          assert tech['checks']['manifest_image_count'] == 30
          assert tech['checks']['existing_files'] == 30
          assert tech['checks']['readable_images'] == 30
          assert tech['checks']['sha256_matches'] == 30
          assert tech['checks']['byte_size_matches'] == 30
          assert tech['checks']['mime_matches'] == 30
          assert tech['checks']['failures'] == 0
          assert tech['page_sequence']['unique_page_numbers'] == 30
          assert tech['page_sequence']['missing_page_numbers'] == []
          assert tech['page_sequence']['duplicate_page_numbers'] == []
          assert tech['raw_mutations'] == 0
          assert disc['counts']['pages'] == 30
          assert disc['counts']['questions'] == 215
          assert disc['page_sequence']['count'] == 30
          assert disc['page_sequence']['contiguous'] is True
          assert disc['individual_exam_models'] == 'NOT VERIFIED'
          assert disc['answer_keys'] == 'NOT VERIFIED'
          assert disc['raw_mutations'] == 0
          print('SCIENCE_1445_DISCOVERY_VERIFY_PASS')
          PY

      - name: Upload discovery and full visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: science-exam-1445-boundary-evidence
          path: |
            artifacts/science-exam-1445/
            content-staging/reconstruction/technical/ef408805-c337-44dd-b903-7838030e6de0.json
            content-staging/reconstruction/exams/source-groups/ef408805-c337-44dd-b903-7838030e6de0-discovery.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit technical and discovery evidence
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/ef408805-c337-44dd-b903-7838030e6de0.json \
            content-staging/reconstruction/exams/source-groups/ef408805-c337-44dd-b903-7838030e6de0-discovery.json
          if git diff --cached --quiet; then
            echo 'Discovery evidence unchanged.'
            exit 0
          fi
          git commit -m 'content: discover science 1445 exam boundaries [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
