name: Record Worker A Seerah Handoff

on:
  push:
    branches: [content/corpus-inventory-20260914]
    paths:
      - '.github/workflows/record-worker-a-seerah-handoff.yml'

permissions:
  contents: write

concurrency:
  group: record-worker-a-seerah-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live finalized truth and update baton
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          sid='a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8'
          next_id='6a8ea7f2-1e77-4654-a28c-0ea1b82b4830'
          baton=Path('content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md')
          master=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text())
          recon=json.loads(Path(f'content-staging/reconstruction/educational/{sid}.json').read_text())
          p=master['reconstruction_progress']
          assert recon['reconstructed_book']['lesson_count']==12 and recon['reconstructed_book']['lesson_member_page_count']==81
          assert recon['questions']['structurally_lesson_linked_questions']==1152
          assert p['sources_completed']==19 and p['educational_sources_completed']==9 and p['verified_books']==9
          assert p['verified_units']==33 and p['verified_lessons']==183 and p['verified_lesson_pages']==810
          assert p['source_images_technically_verified']==1475
          assert p['lesson_linked_structural']==5985 and p['exam_linked_to_individual_model']==967 and p['review_required']==351 and p['unclassified']==18452
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          ns=next(x for x in master['sources'] if x['id']==next_id)
          assert ns['counts']['pages']==67 and ns['counts']['images_downloaded']==67 and ns['counts']['questions']==906 and ns['counts']['image_download_failures']==0
          assert all(not v for v in ns['anomalies'].values())
          text=baton.read_text()
          assert '`a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8 — السيرة النبوية الكتاب ' in text or '`a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8 — السيرة النبوية الكتاب`' in text
          checkpoint='''## 10. ACTIVE CHECKPOINT

- state: `READY_FOR_NEXT_SOURCE`
- branch: `content/corpus-inventory-20260914`
- latest verified work HEAD before this handoff commit: `3dac08e4cf470bd0846a55011518947672459c46`
- last completed source: `a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8 — السيرة النبوية الكتاب`
- current source: `6a8ea7f2-1e77-4654-a28c-0ea1b82b4830 — الفقه الكتاب المدرسي`
- current source baseline from live manifest: `67 pages/images, 906 legacy questions, 0 download failures; manifest anomaly arrays are empty. Technical verification / exact identity / structure / question placement remain NOT VERIFIED until live evidence proves otherwise.`
- current operation: `Re-fetch live HEAD and baton; confirm no active/running workflow for 6a8ea7f2-1e77-4654-a28c-0ea1b82b4830; read its immutable manifest/pages/evidence; technically verify all 67 RAW images first; establish exact educational identity and lesson/unit/review boundaries only from Fiqh-specific evidence; map the 906 legacy questions only where page membership proves placement; preserve unresolved semantics/subtypes as NOT VERIFIED or review_required; reassert the 25,755 invariant.`
- next source: `Resolve from live MASTER_CONTENT_MANIFEST only after Fiqh is safely finalized.`
- blockers: `none at handoff; do not inherit Seerah lesson count, ranges, or page subtype assumptions into Fiqh.`
- owner decision required now: `no`
'''
          pat=r'## 10\. ACTIVE CHECKPOINT\n.*?\n---\n\n### Shared handoff rule'
          repl=checkpoint+'\n---\n\n### Shared handoff rule'
          text,n=re.subn(pat,repl,text,count=1,flags=re.S)
          assert n==1, 'ACTIVE CHECKPOINT replacement failed'
          run='''

## RUN 2026-09-14T16:09:00+03:00 — Worker A

- state: COMPLETE
- start HEAD: `ed4d73d0b95c35310a8a3794cfe811f1bb95af23`
- end HEAD before handoff-log tooling commit: `3dac08e4cf470bd0846a55011518947672459c46`
- phase: `CONTENT RECONSTRUCTION + EXAM BOUNDARY DISCOVERY`
- source at start: `a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8 — السيرة النبوية الكتاب`
- completed in this run:
  - consumed Worker B's live Hadith handoff and confirmed no active/queued conflicting source workflow;
  - technically verified **81/81** immutable Seerah RAW images and regenerated complete contact-sheet evidence;
  - proved **81/81 exact SHA-256 identity** against the single reference directory `التربية الاسلاميه ثالث ثانوي/كتاب السيرة النبوية/الصور` with retained storage pages **8..88** and zero unmatched pages;
  - used only explicit exact-SHA master filename lesson labels to establish **12 lessons** and assign **81/81 retained pages** exactly once to a lesson; no Unit layer was invented (`NOT VERIFIED`);
  - preserved page-subtype uncertainty; only page **88** has explicit filename evidence containing `التقويم والخاتمة`, while other subtype/review boundaries remain `NOT VERIFIED`;
  - structurally mapped **1,152/1,152 legacy questions** by immutable page membership; semantic correctness remains `NOT VERIFIED`;
  - updated MASTER_CONTENT_MANIFEST plus evidence-backed status/handoff/inventory/validation/import/continuation documents; no production import/publication was created;
  - discovery run `34847083098` and finalization run `34847345410` both succeeded, including live-HEAD fail-closed gates and `SEERAH_FINALIZATION_VERIFY_PASS`.
- evidence produced/verified:
  - `content-staging/reconstruction/technical/a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8.json`;
  - `content-staging/reconstruction/educational/a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8-discovery.json`;
  - `content-staging/reconstruction/educational/a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8.json`;
  - contact-sheet artifact `seerah-contact-sheets` from discovery run `34847083098`;
  - final evidence/status commit `3dac08e4cf470bd0846a55011518947672459c46`.
- ambiguity/review_required:
  - unit hierarchy: `NOT VERIFIED`; no unit layer asserted;
  - page 88: explicit filename evidence for `التقويم والخاتمة`; other page subtype/review boundaries: `NOT VERIFIED`;
  - semantic correctness of all 1,152 legacy question texts/answers: `NOT VERIFIED`;
  - source-level review-required question count added this run: 0 because structural page-to-lesson membership is fully proven.
- invariant result: PASS (`5,985 + 967 + 351 + 18,452 = 25,755`)
- Sources processed: 19/58
- Educational: 9/26
- Books / Units / Lessons / Lesson Pages: 9 / 33 / 183 / 810
- Exam Source Groups: 10/32
- Individual Exam Models: 166
- Exam Pages: 548/2,286
- Verified Answer Keys: 0
- Source images technical: 1,475/5,273
- WebP generated / accepted / rejected: 0 / 0 / 0
- Legacy Questions: 25,755
- Lesson-linked: 5,985
- Exam-linked: 967
- Review-required: 351
- Unclassified: 18,452
- Duplicate groups classified: 0/99
- RAW mutations: 0
- Unrelated mutations: 0
- New imports: 0
- New publications: 0
- last completed source: `a89c6c5d-d3d2-4aed-b98c-2ef5224cdae8 — السيرة النبوية الكتاب`
- current source: `6a8ea7f2-1e77-4654-a28c-0ea1b82b4830 — الفقه الكتاب المدرسي`
- exact next operation: `Re-fetch live HEAD/baton; verify no active workflow for Fiqh; technically verify all 67 images; prove source identity and lesson/unit/review boundaries from its own evidence only; structurally map 906 questions only where page membership is proven; preserve uncertainty as review_required/NOT VERIFIED; assert the global 25,755 invariant; checkpoint.`
- next source: `NOT YET RESOLVED — derive only after Fiqh from live MASTER_CONTENT_MANIFEST`
- blockers: `none at handoff.`
- handoff note: `Worker B should begin only from 6a8ea7f2-1e77-4654-a28c-0ea1b82b4830 after re-fetching live HEAD and this baton. Do not rerun/finalize Seerah absent new drift evidence. Do not inherit Seerah's 12-lesson structure or page ranges into Fiqh.`
'''
          text=text.rstrip()+run+'\n'
          baton.write_text(text)
          print('WORKER_A_SEERAH_HANDOFF_VERIFY_PASS')
          PY
      - name: Re-fetch live branch before shared-log write
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          LIVE=$(git rev-parse origin/content/corpus-inventory-20260914)
          LOCAL=$(git rev-parse HEAD)
          test "$LIVE" = "$LOCAL" || { echo "Shared-log write safety gate: branch changed live=$LIVE local=$LOCAL"; exit 24; }
      - name: Commit Worker A handoff
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git commit -m 'content: hand off Seerah completion to Worker B [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
