name: Record Worker B Fiqh Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-b-fiqh-handoff.yml'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-fetch live branch before shared-log mutation
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          LIVE=$(git rev-parse origin/content/corpus-inventory-20260914)
          LOCAL=$(git rev-parse HEAD)
          test "$LIVE" = "$LOCAL" || { echo "Shared-log safety gate: branch changed live=$LIVE local=$LOCAL"; exit 24; }
      - name: Verify live Fiqh checkpoint and update baton
        run: |
          python - <<'PY'
          import json,re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          baton=Path('content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md')
          master=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text())
