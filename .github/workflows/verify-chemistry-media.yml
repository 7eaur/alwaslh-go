name: Verify Chemistry Source Media

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/verify-chemistry-media.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/reconstruct_chemistry_source.py'
      - 'content-staging/tools/record_chemistry_reconstruction_checkpoint.py'

permissions:
  contents: write

concurrency:
  group: verify-chemistry-source-media
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Checkout trusted master reference
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-reference
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify Chemistry RAW media without mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id f0c5228c-7d5b-4ec2-85ed-ce59139ce0a4

      - name: Reconstruct verified Book Unit Lesson boundaries
        run: |
          set -euo pipefail
          test "$(git -C master-reference rev-parse HEAD)" = "f81ebb6ef6198818fa091f7a8c1c81b4de7dbd23"
          python content-staging/tools/reconstruct_chemistry_source.py

      - name: Record reconstruction checkpoint in source-of-truth reports
        run: |
          set -euo pipefail
          python content-staging/tools/record_chemistry_reconstruction_checkpoint.py

      - name: Commit derived reconstruction and checkpoint reports
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/f0c5228c-7d5b-4ec2-85ed-ce59139ce0a4.json \
            content-staging/reconstruction/educational/f0c5228c-7d5b-4ec2-85ed-ce59139ce0a4.json \
            content-staging/manifests/MASTER_CONTENT_MANIFEST.json \
            content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md \
            content-staging/CONTENT_REBUILD_HANDOFF.md \
            content-staging/CONTENT_INVENTORY.md \
            content-staging/CONTENT_VALIDATION_REPORT.md \
            content-staging/CONTENT_IMPORT_REPORT.md
          if git diff --cached --quiet; then
            echo 'Derived reports unchanged.'
            exit 0
          fi
          git commit -m 'docs(content): record chemistry reconstruction checkpoint [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
