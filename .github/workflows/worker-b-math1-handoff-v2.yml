name: Worker B Math1 Handoff V2 Retry

on:
  push:
    branches:
      - 'content/corpus-inventory-20260914'
    paths:
      - '.github/workflows/worker-b-math1-handoff-v2.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify live head
        shell: bash
        run: |
          LIVE=$(git ls-remote origin refs/heads/content/corpus-inventory-20260914 | cut -f1)
          if [ "$LIVE" != "$GITHUB_SHA" ]; then exit 41; fi
      - name: Record baton
        run: python content-staging/tools/record_worker_b_math_part1_handoff.py
      - name: Commit baton
        shell: bash
        run: |
          LIVE=$(git ls-remote origin refs/heads/content/corpus-inventory-20260914 | cut -f1)
          if [ "$LIVE" != "$GITHUB_SHA" ]; then exit 42; fi
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git commit -m 'content: hand off Math Part 2 to Worker A [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
