name: Record Worker A Islamic 1447 Handoff
on:
  push:
    branches: [content/corpus-inventory-20260914]
    paths:
      - '.github/workflows/record-worker-a-islamic1447-handoff.yml'
permissions:
  contents: write
concurrency:
  group: content-reconstruction-handoff
  cancel-in-progress: false
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: content/corpus-inventory-20260914, fetch-depth: 0}
      - name: Re-fetch live HEAD before shared-log mutation
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "$(git rev-parse HEAD)" || exit 23
      - name: Record Worker A run and active checkpoint
        run: python content-staging/tools/record_worker_a_islamic1447_handoff.py
      - name: Verify baton
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md').read_text()
          assert 'last completed source: `f25891fe-ea52-481b-baf2-ff4764c79bde — الاسلاميه ثانوي نماذج وزاريه 1447`' in t
          assert 'Sources processed: 17/58' in t
          assert 'Individual Exam Models: 166' in t
          assert 'current source: `cae82d8f-64f9-4d2a-984f-6e6fd19fac5c — الحديث والتهذيب الكتاب `' in t
          print('WORKER_A_ISLAMIC1447_HANDOFF_VERIFY_PASS')
          PY
      - name: Re-fetch immediately before shared-log write
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "$(git rev-parse HEAD)" || exit 24
      - name: Commit shared baton
        run: |
          set -euo pipefail
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git commit -m 'content: hand off Islamic 1447 completion to Worker B [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
