name: Record Worker B Math 1446 Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-b-math1446-handoff.yml'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - name: Fail closed on live-head drift before baton generation
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "${GITHUB_SHA}" || exit 41
      - name: Generate Worker B baton update
        run: python content-staging/tools/record_worker_b_math1446_handoff.py
      - name: Re-fetch live head before shared-log write
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "${GITHUB_SHA}" || exit 42
      - name: Commit shared baton only
        run: |
          set -euo pipefail
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git diff --cached --quiet && exit 43 || true
          git commit -m 'content: hand off Math 1446 completion to Worker A [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
