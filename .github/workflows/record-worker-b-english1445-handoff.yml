name: Record Worker B English 1445 Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-b-english1445-handoff.yml'
      - 'content-staging/tools/record_worker_b_english_1445_handoff.py'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Assert finalized English 1445 content HEAD is ancestor
        run: git merge-base --is-ancestor cbb294ada860c16bbf647499983361a5bae0def0 HEAD

      - name: Record shared handoff
        run: python content-staging/tools/record_worker_b_english_1445_handoff.py

      - name: Commit shared handoff only
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Shared handoff already current.'
            exit 0
          fi
          git commit -m 'docs: hand off after english 1445 reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
