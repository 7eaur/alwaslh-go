- current source: `{next_sid} — {next_name}`
- exact next operation: `Re-fetch live HEAD/baton; verify no active workflow for {next_sid}; technically verify all 42 immutable RAW images; independently discover Arabic 1447 duplicate/model/correction boundaries from complete source-local evidence; do not inherit prior-source packet sizes; there are 0 legacy questions, so do not invent mappings; quarantine uncertainty as review_required/NOT VERIFIED; assert the 25,755 invariant; checkpoint.`
