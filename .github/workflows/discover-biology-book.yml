name: Discover Biology Book

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-biology-book.yml'
      - 'content-staging/tools/discover_biology_book.py'

permissions:
  contents: write

concurrency:
  group: discover-biology-book
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - name: Checkout trusted master reference
        uses: actions/checkout@v4
        with:
          ref: master
          path: master-reference
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify immutable RAW media
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py --subject-id 67d4ffae-68e1-42e8-9c3b-72329973c93d

      - name: Verify exact master identity and discover structure candidates
        run: |
          set -euo pipefail
          python content-staging/tools/discover_biology_book.py

      - name: Assert non-destructive discovery
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sid='67d4ffae-68e1-42e8-9c3b-72329973c93d'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text())
          d=json.loads(Path(f'content-staging/reconstruction/educational/{sid}-discovery.json').read_text())
          assert t['all_images_technically_verified'] is True
          assert t['checks']['manifest_image_count']==214
          assert d['identity_status']=='VERIFIED_EXACT_SHA'
          assert d['exact_sha_identity_count']==214
          assert d['preferred_master_exact_sha_count']==214
          assert d['raw_mutations']==0
          assert d['lesson_boundaries_status']=='NOT VERIFIED'
          print('BIOLOGY_DISCOVERY_PASS')
          PY

      - name: Upload complete contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: biology-contact-sheets
          path: /tmp/biology-contact-sheets/*.jpg
          if-no-files-found: error

      - name: Re-fetch live branch before evidence commit
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo 'LIVE_HEAD_DRIFT'; exit 42; }

      - name: Commit derived discovery evidence
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/reconstruction/technical/67d4ffae-68e1-42e8-9c3b-72329973c93d.json content-staging/reconstruction/educational/67d4ffae-68e1-42e8-9c3b-72329973c93d-discovery.json
          if git diff --cached --quiet; then
            echo 'Derived discovery unchanged.'
            exit 0
          fi
          git commit -m 'content: record biology book discovery evidence [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
