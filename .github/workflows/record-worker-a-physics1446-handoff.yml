name: Record Worker A Physics 1446 Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-a-physics1446-handoff.yml'

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - name: Gate exact live head before handoff
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo LIVE_HEAD_DRIFT_BEFORE_HANDOFF; exit 42; }
      - name: Prepare shared baton from live evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          ROOT=Path('.'); log_path=ROOT/'content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md'
          master=json.loads((ROOT/'content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          sid='0b28dc73-7e43-45f1-99c8-14825dcf3ded'; next_sid='bbc5c2e7-9b96-4502-a8b0-6a14d2f8782a'
          src=next(s for s in master['sources'] if s.get('id')==sid); nxt=next(s for s in master['sources'] if s.get('id')==next_sid)
          if src.get('review_status')!='processed_boundary_verified_answer_keys_not_verified': raise SystemExit('Physics 1446 not canonically processed')
          p=master['reconstruction_progress']; expected={'sources_completed':34,'educational_sources_completed':16,'exam_source_groups_completed':18,'individual_exam_models':325,'exam_pages_completed':1108,'source_images_technically_verified':2855,'lesson_linked_structural':13135,'exam_linked_to_individual_model':1665,'review_required':1229,'unclassified':9726,'raw_mutations':0,'unrelated_mutations':0,'new_imports':0,'new_publications':0}
          for k,v in expected.items():
              if int(p.get(k) or 0)!=v: raise SystemExit(f'progress drift {k}: {p.get(k)} != {v}')
          if sum(int(p.get(k) or 0) for k in ('lesson_linked_structural','exam_linked_to_individual_model','review_required','unclassified'))!=25755: raise SystemExit('global invariant drift')
          nm=json.loads((ROOT/'content-staging/raw/legacy-supabase/subjects'/next_sid/'manifest.json').read_text(encoding='utf-8')); c=nm['counts']; a=nm['anomalies']
          if (c.get('pages'),c.get('images_downloaded'),c.get('questions'),c.get('image_download_failures'))!=(124,124,255,0): raise SystemExit('next-source baseline drift')
          if any(a.get(k) for k in ('duplicate_page_numbers','invalid_subject_ids','malformed_ai_questions','malformed_image_urls','missing_images','multiple_images','null_or_invalid_page_numbers')): raise SystemExit('next-source anomaly drift')
          evidence_head='bac8c301d6d66b2e159831392db4ee86b4bdc745'; trigger_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); next_name=(nxt.get('legacy_source') or {}).get('name') or nxt.get('name') or 'UNKNOWN'
          active=f'''## 10. ACTIVE CHECKPOINT

- state: `READY_NEXT_SOURCE`
- branch: `content/corpus-inventory-20260914`
- latest evidence HEAD before this handoff tooling: `{evidence_head}`
- last completed source: `{sid} — الفيزياء نماذج وزاريه 1446`
- current source: `{next_sid} — {next_name}`
- current source baseline from live manifest: `124 pages / 124 images / 255 legacy questions / 0 download failures; anomaly arrays empty.`
- current source verified work: `NOT STARTED; no Physics 1445/1446 packet size or boundary pattern may be inherited.`
- current operation: `Re-fetch live HEAD and baton; confirm no active/running workflow for this exact source; technically verify all 124 immutable RAW images; perform source-local duplicate scan and exam-boundary discovery; visually inspect complete source evidence; resolve occurrences, Individual Exam Models, correction/result candidates and Answer-Key evidence without inheriting prior Physics patterns; structurally map the 255 legacy questions only where verified page membership supports it; use review_required/NOT VERIFIED when evidence is insufficient; assert global invariants; checkpoint.`
- next source: `Resolve only after Physics 1447 finalization from live MASTER.`
- blockers: `none`
- completed Physics 1446 evidence: `104/104 immutable RAW images technically verified; sequence 1..104 contiguous; 6 duplicate SHA groups preserved; complete visual review proves 26 four-page occurrences, each three question pages plus one correction/result candidate; 26 Individual Exam Models / 104 Exam Pages finalized; 26 correction candidates; 0 verified standalone Answer Keys; 200/200 legacy questions structurally linked by verified page membership; semantic correctness NOT VERIFIED; RAW/unrelated/import/publication mutations 0.`
'''
          text=log_path.read_text(encoding='utf-8'); marker='## 10. ACTIVE CHECKPOINT'; shared='---\n\n### Shared handoff rule'
          if marker not in text or shared not in text: raise SystemExit('shared baton anchors missing')
          before=text.split(marker,1)[0]; after=text.split(shared,1)[1]; text=before+active+'\n---\n\n### Shared handoff rule'+after
          now=datetime.now(timezone(timedelta(hours=3))).isoformat(timespec='seconds')
          run=f'''\n\n## RUN {now} — Worker A

- state: `COMPLETE_SOURCE_HANDOFF`
- start HEAD: `bfc1084d913c50292193977db28ce851444b43e9`
- evidence HEAD before handoff tooling: `{evidence_head}`
- handoff-trigger HEAD: `{trigger_head}`
- phase: `CONTENT RECONSTRUCTION + EXAM BOUNDARY DISCOVERY`
- source at start: `{sid} — الفيزياء نماذج وزاريه 1446`
- completed in this run:
  - consumed the live baton and verified the prior Physics 1445 checkpoint/current source against live HEAD/manifests/evidence;
  - confirmed no active/running workflow for Physics 1446 before source work;
  - technically verified **104/104** immutable RAW images with byte-size/SHA-256/MIME agreement, contiguous sequence **1..104**, **6** duplicate SHA groups preserved and **0** RAW mutations;
  - generated and visually inspected complete contact sheets covering all **104** pages;
  - discovered from Physics 1446 itself **26** source-local four-page occurrences, each three question pages followed by one correction/result-sheet candidate; all 104 pages are finalized exactly once;
  - preserved partial duplicate question sheets without merging occurrences because paired fourth-page correction/result evidence differs; official model codes remain `NOT VERIFIED`;
  - finalized **26 Individual Exam Models / 104 Exam Pages**, **26 correction/result candidates**, **0 review-required pages**, and **0 verified standalone Answer Keys**;
  - structurally linked **200/200 legacy questions** to verified model membership; semantic correctness remains `NOT VERIFIED`;
  - updated canonical reconstruction, MASTER and evidence-backed status/handoff/inventory/validation/import/continuation files; no production import/publication was created;
  - discovery run `34904572614` and finalization run `34905014753` passed their gates; finalization passed exact-live-HEAD gates before finalization, evidence write, and commit.
- evidence/artifacts:
  - `content-staging/reconstruction/technical/{sid}.json`;
  - `content-staging/reconstruction/exams/source-groups/{sid}-discovery.json`;
  - `content-staging/reconstruction/exams/source-groups/{sid}.json`;
  - discovery artifact `physics-exam-1446-discovery-evidence` id `10372551381`;
  - final artifact `physics-exam-1446-final-evidence` id `10372671720`;
  - canonical evidence commit `{evidence_head}`.
- ambiguity/review_required:
  - source boundary ambiguity: none after complete visual review;
  - standalone official Answer Keys: `NOT VERIFIED`; correction/result pages remain candidates only;
  - official model codes/titles/term: `NOT VERIFIED`;
  - semantic correctness of all 200 legacy questions/answers: `NOT VERIFIED`.
- invariant result: PASS (`13,135 + 1,665 + 1,229 + 9,726 = 25,755`)
- Sources processed: 34/58
- Educational: 16/26
- Books / Units / Lessons / Lesson Pages: 14 / 57 / 328 / 1,527
