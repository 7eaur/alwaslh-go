name: Discover English Exam 1445 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-english-exam-1445.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'
      - 'content-staging/tools/reconstruct_english_exam_1445.py'
      - 'content-staging/tools/record_english_exam_1445_checkpoint.py'

permissions:
  contents: write

concurrency:
  group: discover-english-exam-1445
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id 8489a487-91d9-47fb-80b8-35d0e7a074a4

      - name: Discover source-local boundary candidates and render full visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/english-exam-1445
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 8489a487-91d9-47fb-80b8-35d0e7a074a4 \
            --visual-dir artifacts/english-exam-1445

      - name: Reconstruct verified English 1445 exam boundaries
        run: |
          set -euo pipefail
          python content-staging/tools/reconstruct_english_exam_1445.py

      - name: Record source-group checkpoint
        run: |
          set -euo pipefail
          python content-staging/tools/record_english_exam_1445_checkpoint.py

      - name: Validate finalized reconstruction and global invariant
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/technical/8489a487-91d9-47fb-80b8-35d0e7a074a4.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4-discovery.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('content-staging/reconstruction/technical/8489a487-91d9-47fb-80b8-35d0e7a074a4.json').read_text(encoding='utf-8'))
          r = json.loads(Path('content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4.json').read_text(encoding='utf-8'))
          c = t['checks']
          assert c['manifest_image_count'] == 30
          assert c['existing_files'] == c['readable_images'] == c['byte_size_matches'] == c['sha256_matches'] == c['mime_matches'] == 30
          assert c['failures'] == 0 and t['all_images_technically_verified'] is True
          assert r['source_pages'] == 30 and r['source_questions'] == 0
          assert r['source_blocks_reviewed'] == 10
          assert r['verified_source_occurrence_count'] == 10
          assert r['review_required_block_count'] == 0
          assert r['individual_exam_model_count'] == 10
          assert r['finalized_exam_page_count'] == 30
          assert r['review_required_page_count'] == 0
          assert r['correction_sheet_candidate_count'] == 10
          assert r['verified_answer_key_count'] == 0
          assert r['duplicate_sha256_groups_within_source'] == 0
          q = r['question_mapping']
          assert q['exam_linked_structural'] == 0 and q['review_required'] == 0 and q['unassigned_within_source'] == 0 and q['records'] == []
          assert r['evidence']['raw_mutations'] == 0
          m = json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          p = m['reconstruction_progress']
          assert p['lesson_linked_structural'] + p['exam_linked_to_individual_model'] + p['review_required'] + p['unclassified'] == 25755
          assert p['raw_mutations'] == 0 and p['unrelated_mutations'] == 0 and p['new_imports'] == 0 and p['new_publications'] == 0
          print('ENGLISH_1445_FINALIZATION_VERIFY_PASS')
          print(json.dumps({'global_progress': p}, ensure_ascii=False))
          PY

      - name: Upload finalized boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: english-exam-1445-boundary-evidence-final
          path: |
            artifacts/english-exam-1445/
            content-staging/reconstruction/technical/8489a487-91d9-47fb-80b8-35d0e7a074a4.json
            content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4-discovery.json
            content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit finalized reconstruction checkpoint
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/8489a487-91d9-47fb-80b8-35d0e7a074a4.json \
            content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4-discovery.json \
            content-staging/reconstruction/exams/source-groups/8489a487-91d9-47fb-80b8-35d0e7a074a4.json \
            content-staging/manifests/MASTER_CONTENT_MANIFEST.json \
            content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md \
            content-staging/CONTENT_REBUILD_HANDOFF.md \
            content-staging/CONTENT_INVENTORY.md \
            content-staging/CONTENT_VALIDATION_REPORT.md \
            content-staging/CONTENT_IMPORT_REPORT.md \
            content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          if git diff --cached --quiet; then
            echo 'Derived reports unchanged.'
            exit 0
          fi
          git commit -m 'content: finalize english 1445 exam reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
