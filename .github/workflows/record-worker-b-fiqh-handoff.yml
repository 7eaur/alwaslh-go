          assert p['raw_mutations']==0 and p['unrelated_mutations']==0 and p['new_imports']==0 and p['new_publications']==0
          sid='6a8ea7f2-1e77-4654-a28c-0ea1b82b4830'; nxt='0d4fa9fd-a93c-4d18-9dea-6dd22eb2e199'
          s=next(x for x in p['sources'] if x['id']==sid); n=next(x for x in p['sources'] if x['id']==nxt)
          assert s['review_status']=='reconstructed_verified_exact_sha_lesson_membership'
          assert n['legacy_source']['name'].strip()=='الرياضيات نماذج وزارية 1445'
          text=baton.read_text(encoding='utf-8')
          old=re.search(r'## 10\. ACTIVE CHECKPOINT\n.*?\n---\n\n### Shared handoff rule',text,re.S)
          assert old, 'ACTIVE CHECKPOINT block not found'
          active='''## 10. ACTIVE CHECKPOINT

