name: Discover Physics Exam 1446 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-physics-exam-1446.yml'

permissions:
  contents: read

concurrency:
  group: discover-physics-exam-1446
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py --subject-id 0b28dc73-7e43-45f1-99c8-14825dcf3ded

      - name: Discover source-local boundary candidates and render full visual evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/physics-exam-1446
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 0b28dc73-7e43-45f1-99c8-14825dcf3ded \
            --visual-dir artifacts/physics-exam-1446

      - name: Validate source-local discovery only
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/technical/0b28dc73-7e43-45f1-99c8-14825dcf3ded.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/0b28dc73-7e43-45f1-99c8-14825dcf3ded-discovery.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          sid='0b28dc73-7e43-45f1-99c8-14825dcf3ded'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text(encoding='utf-8'))
          d=json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{sid}-discovery.json').read_text(encoding='utf-8'))
          c=t['checks']
          assert t['all_images_technically_verified'] is True
          for k in ('manifest_image_count','existing_files','readable_images','sha256_matches','byte_size_matches','mime_matches'):
              assert c[k] == 104, (k,c[k])
          assert c['failures']==0 and t['raw_mutations']==0
          assert d['counts']['pages']==104 and d['counts']['images_downloaded']==104
          assert d['counts']['image_download_failures']==0 and d['counts']['questions']==200
          assert d['raw_mutations']==0
          print('PHYSICS_1446_DISCOVERY_VERIFY_PASS')
          print(json.dumps({'technical':t,'discovery':d},ensure_ascii=False))
          PY

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: physics-exam-1446-discovery-evidence
          path: |
            artifacts/physics-exam-1446/
            content-staging/reconstruction/technical/0b28dc73-7e43-45f1-99c8-14825dcf3ded.json
            content-staging/reconstruction/exams/source-groups/0b28dc73-7e43-45f1-99c8-14825dcf3ded-discovery.json
          if-no-files-found: error
          retention-days: 14
