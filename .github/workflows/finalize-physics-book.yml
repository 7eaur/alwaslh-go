name: Finalize Physics Book

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/finalize-physics-book.yml'

permissions:
  contents: write

concurrency:
  group: finalize-physics-book
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - name: Gate exact live head before finalization
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo LIVE_HEAD_DRIFT_BEFORE_FINALIZATION; exit 42; }
      - uses: actions/checkout@v4
        with:
          ref: master
          path: master-reference
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Reverify source and exact identity
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py --subject-id 4863bbf6-6cf3-4238-9407-75825724292a
          python content-staging/tools/discover_physics_book.py
      - name: Reconstruct verified physics structure
        run: python content-staging/tools/reconstruct_physics_book.py
      - name: Record corpus checkpoint
        run: python content-staging/tools/record_physics_checkpoint.py
      - name: Verify final invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sid='4863bbf6-6cf3-4238-9407-75825724292a'
          r=json.loads(Path(f'content-staging/reconstruction/educational/{sid}.json').read_text()); m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text()); p=m['reconstruction_progress']
          assert r['status']=='reconstructed_verified'
          assert (r['reconstructed_book']['unit_count'],r['reconstructed_book']['lesson_count'],r['reconstructed_book']['lesson_page_count'],r['reconstructed_book']['unit_cover_page_count'],r['reconstructed_book']['unit_review_page_count'])==(9,45,173,9,25)
          assert r['questions']['structurally_lesson_linked_questions']+r['questions']['review_required_questions']==3101
          assert (p['sources_completed'],p['educational_sources_completed'],p['verified_books'],p['verified_units'],p['verified_lessons'],p['verified_lesson_pages'],p['source_images_technically_verified'])==(32,16,14,57,328,1527,2691)
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          assert all(p[k]==0 for k in ('raw_mutations','unrelated_mutations','new_imports','new_publications'))
          print('PHYSICS_FINALIZATION_VERIFY_PASS',r['questions']['structurally_lesson_linked_questions'],r['questions']['review_required_questions'],p['unclassified'])
          PY
      - name: Re-fetch live branch before evidence commit
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo LIVE_HEAD_DRIFT_BEFORE_WRITE; exit 42; }
      - name: Commit finalized reconstruction and checkpoint
        run: |
          set -euo pipefail
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/reconstruction/technical/4863bbf6-6cf3-4238-9407-75825724292a.json content-staging/reconstruction/educational/4863bbf6-6cf3-4238-9407-75825724292a-discovery.json content-staging/reconstruction/educational/4863bbf6-6cf3-4238-9407-75825724292a.json content-staging/manifests/MASTER_CONTENT_MANIFEST.json content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md content-staging/CONTENT_REBUILD_HANDOFF.md content-staging/CONTENT_INVENTORY.md content-staging/CONTENT_VALIDATION_REPORT.md content-staging/CONTENT_IMPORT_REPORT.md content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          git commit -m 'content: finalize physics book reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
