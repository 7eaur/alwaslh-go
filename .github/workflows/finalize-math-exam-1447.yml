name: Finalize Mathematics Exam 1447 Reconstruction

on:
  push:
    branches: [content/corpus-inventory-20260914]
    paths: ['.github/workflows/finalize-math-exam-1447.yml']

permissions:
  contents: write

concurrency:
  group: content-reconstruction-shared-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Fail closed on live-head drift before finalization
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "${GITHUB_SHA}" || { echo LIVE_HEAD_DRIFT_FAIL_CLOSED; exit 41; }
      - name: Re-verify immutable media
        run: python content-staging/tools/verify_subject_media.py --subject-id fef5e58f-21df-42e3-81ae-6966cd7bad10
      - name: Reconstruct Math 1447 from source-local evidence
        run: python content-staging/tools/reconstruct_math_exam_1447.py
      - name: Record master/status checkpoint
        run: python content-staging/tools/record_math_exam_1447_checkpoint.py
      - name: Verify reconstruction and global invariant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sid='fef5e58f-21df-42e3-81ae-6966cd7bad10'
          r=json.loads((Path('content-staging/reconstruction/exams/source-groups')/f'{sid}.json').read_text(encoding='utf-8'))
          m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          p=m['reconstruction_progress']; s=next(x for x in m['sources'] if x['id']==sid)
          assert r['individual_exam_model_count']==14
          assert r['finalized_exam_page_count']==42 and r['review_required_page_count']==0
          assert r['correction_sheet_candidate_count']==14 and r['verified_answer_key_count']==0
          assert r['question_mapping']['exam_linked_structural']==112 and r['question_mapping']['unassigned_within_source']==0
          assert r['evidence']['visual_semantic_review']=='NOT VERIFIED'
          assert s['review_status']=='processed_boundary_verified_explicit_titles_visual_semantics_not_verified_answer_keys_not_verified'
          assert s['exam_reconstruction']['visual_semantic_review']=='NOT VERIFIED'
          assert p['sources_completed']==23 and p['exam_source_groups_completed']==13
          assert p['individual_exam_models']==206 and p['exam_pages_completed']==668
          assert p['source_images_technically_verified']==1665
          assert p['exam_linked_to_individual_model']==1132 and p['unclassified']==17381
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          assert p['raw_mutations']==p['unrelated_mutations']==p['new_imports']==p['new_publications']==0
          print('MATH_1447_FINALIZATION_VERIFY_PASS')
          print(json.dumps(p,ensure_ascii=False))
          PY
      - name: Re-fetch live head before finalization write
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse origin/content/corpus-inventory-20260914)" = "${GITHUB_SHA}" || { echo LIVE_HEAD_DRIFT_FAIL_CLOSED; exit 42; }
      - name: Commit evidence-backed finalization
        run: |
          set -euo pipefail
          git config user.name alwaslh-content-bot
          git config user.email actions@users.noreply.github.com
          git add content-staging/reconstruction/technical/fef5e58f-21df-42e3-81ae-6966cd7bad10.json content-staging/reconstruction/exams/source-groups/fef5e58f-21df-42e3-81ae-6966cd7bad10.json content-staging/manifests/MASTER_CONTENT_MANIFEST.json content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md content-staging/CONTENT_REBUILD_HANDOFF.md content-staging/CONTENT_INVENTORY.md content-staging/CONTENT_VALIDATION_REPORT.md content-staging/CONTENT_IMPORT_REPORT.md content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          git diff --cached --quiet && exit 43 || true
          git commit -m 'content: finalize Math 1447 reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
