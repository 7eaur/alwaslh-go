name: Finalize Physics Exam 1445 Reconstruction

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/finalize-physics-exam-1445.yml'

permissions:
  contents: write

concurrency:
  group: finalize-physics-exam-1445
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Gate exact live head before finalization
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo 'LIVE_HEAD_DRIFT_BEFORE_FINALIZATION'; exit 42; }

      - name: Reverify immutable RAW and regenerate discovery evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/physics-exam-1445-final
          python content-staging/tools/verify_subject_media.py --subject-id 41e5a81c-3b93-479c-9b76-33815cae9430
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id 41e5a81c-3b93-479c-9b76-33815cae9430 \
            --visual-dir artifacts/physics-exam-1445-final

      - name: Reconstruct verified Physics 1445 boundaries
        run: |
          set -euo pipefail
          python content-staging/tools/reconstruct_physics_exam_1445.py
          python content-staging/tools/record_physics_exam_1445_checkpoint.py

      - name: Validate final reconstruction and global invariants
        run: |
          set -euo pipefail
          python -m json.tool content-staging/reconstruction/exams/source-groups/41e5a81c-3b93-479c-9b76-33815cae9430.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          sid='41e5a81c-3b93-479c-9b76-33815cae9430'
          r=json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{sid}.json').read_text(encoding='utf-8'))
          assert r['source_pages']==60 and r['source_questions']==83
          assert r['source_blocks_reviewed']==20 and r['verified_source_occurrence_count']==20
          assert r['review_required_block_count']==0
          assert r['individual_exam_model_count']==20 and r['finalized_exam_page_count']==60
          assert r['review_required_page_count']==0
          assert r['correction_sheet_candidate_count']==20 and r['verified_answer_key_count']==0
          assert r['duplicate_sha256_groups_within_source']==0
          q=r['question_mapping']
          assert q['exam_linked_structural']==83 and q['review_required']==0 and q['unassigned_within_source']==0 and len(q['records'])==83
          assert r['evidence']['raw_mutations']==0
          m=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text(encoding='utf-8'))
          p=m['reconstruction_progress']
          assert p['lesson_linked_structural'] + p['exam_linked_to_individual_model'] + p['review_required'] + p['unclassified'] == 25755
          assert p['raw_mutations']==0 and p['unrelated_mutations']==0 and p['new_imports']==0 and p['new_publications']==0
          assert p['sources_completed']==33 and p['exam_source_groups_completed']==17
          assert p['individual_exam_models']==299 and p['exam_pages_completed']==1004 and p['source_images_technically_verified']==2751
          assert p['lesson_linked_structural']==13135 and p['exam_linked_to_individual_model']==1465 and p['review_required']==1229 and p['unclassified']==9926
          print('PHYSICS_1445_FINALIZATION_VERIFY_PASS')
          print(json.dumps({'global_progress':p},ensure_ascii=False))
          PY

      - name: Gate exact live head before evidence write
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/content/corpus-inventory-20260914)" || { echo 'LIVE_HEAD_DRIFT_BEFORE_EVIDENCE_WRITE'; exit 42; }

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: physics-exam-1445-final-evidence
          path: |
            artifacts/physics-exam-1445-final/
            content-staging/reconstruction/technical/41e5a81c-3b93-479c-9b76-33815cae9430.json
            content-staging/reconstruction/exams/source-groups/41e5a81c-3b93-479c-9b76-33815cae9430-discovery.json
            content-staging/reconstruction/exams/source-groups/41e5a81c-3b93-479c-9b76-33815cae9430.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit canonical evidence
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/41e5a81c-3b93-479c-9b76-33815cae9430.json \
            content-staging/reconstruction/exams/source-groups/41e5a81c-3b93-479c-9b76-33815cae9430-discovery.json \
            content-staging/reconstruction/exams/source-groups/41e5a81c-3b93-479c-9b76-33815cae9430.json \
            content-staging/manifests/MASTER_CONTENT_MANIFEST.json \
            content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md \
            content-staging/CONTENT_REBUILD_HANDOFF.md \
            content-staging/CONTENT_INVENTORY.md \
            content-staging/CONTENT_VALIDATION_REPORT.md \
            content-staging/CONTENT_IMPORT_REPORT.md \
            content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          if git diff --cached --quiet; then echo 'Derived evidence unchanged.'; exit 0; fi
          git commit -m 'content: finalize Physics 1445 exam reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
