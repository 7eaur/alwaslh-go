name: Record Worker A Seerah Handoff

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/record-worker-a-seerah-handoff.yml'

permissions:
  contents: write

concurrency:
  group: record-worker-a-seerah-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update shared baton from verified Seerah state
        run: python content-staging/tools/record_worker_a_seerah_handoff.py
      - name: Re-fetch live branch before shared-log write
        run: |
          set -euo pipefail
          git fetch origin content/corpus-inventory-20260914
          LIVE=$(git rev-parse origin/content/corpus-inventory-20260914)
          LOCAL=$(git rev-parse HEAD)
          test "$LIVE" = "$LOCAL" || { echo "Shared-log write safety gate: branch changed live=$LIVE local=$LOCAL"; exit 24; }
      - name: Commit Worker A handoff
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/CONTENT_RECONSTRUCTION_AUTOMATION_LOG.md
          git commit -m 'content: hand off Seerah completion to Worker B [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
