name: Discover Chemistry Exam 1446 Boundaries

on:
  push:
    branches:
      - content/corpus-inventory-20260914
    paths:
      - '.github/workflows/discover-chemistry-exam-1446.yml'
      - 'content-staging/tools/verify_subject_media.py'
      - 'content-staging/tools/discover_exam_source_group.py'

permissions:
  contents: write

concurrency:
  group: discover-chemistry-exam-1446
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify source-group media without RAW mutations
        run: |
          set -euo pipefail
          python content-staging/tools/verify_subject_media.py \
            --subject-id c09ce569-ea42-4f0b-997f-95b029a7e6ea

      - name: Discover storage and metadata boundary candidates
        run: |
          set -euo pipefail
          mkdir -p artifacts/chemistry-exam-1446
          python content-staging/tools/discover_exam_source_group.py \
            --subject-id c09ce569-ea42-4f0b-997f-95b029a7e6ea \
            --visual-dir artifacts/chemistry-exam-1446

      - name: Upload boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-exam-1446-boundary-evidence
          path: |
            artifacts/chemistry-exam-1446/
            content-staging/reconstruction/technical/c09ce569-ea42-4f0b-997f-95b029a7e6ea.json
            content-staging/reconstruction/exams/source-groups/c09ce569-ea42-4f0b-997f-95b029a7e6ea-discovery.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit derived discovery reports only
        run: |
          set -euo pipefail
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content-staging/reconstruction/technical/c09ce569-ea42-4f0b-997f-95b029a7e6ea.json \
            content-staging/reconstruction/exams/source-groups/c09ce569-ea42-4f0b-997f-95b029a7e6ea-discovery.json
          if git diff --cached --quiet; then
            echo 'Derived reports unchanged.'
            exit 0
          fi
          git commit -m 'content: discover chemistry 1446 exam boundary candidates [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
