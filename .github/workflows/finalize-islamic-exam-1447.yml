name: Finalize Islamic Exam 1447 Reconstruction

on:
  push:
    branches: [content/corpus-inventory-20260914]
    paths:
      - '.github/workflows/finalize-islamic-exam-1447.yml'
      - 'content-staging/tools/reconstruct_islamic_exam_1447.py'
      - 'content-staging/tools/record_islamic_exam_1447_checkpoint.py'

permissions:
  contents: write

concurrency:
  group: finalize-islamic-exam-1447
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/corpus-inventory-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify source-group media
        run: python content-staging/tools/verify_subject_media.py --subject-id f25891fe-ea52-481b-baf2-ff4764c79bde
      - name: Rebuild discovery evidence
        run: |
          mkdir -p artifacts/islamic-exam-1447-final
          python content-staging/tools/discover_exam_source_group.py --subject-id f25891fe-ea52-481b-baf2-ff4764c79bde --visual-dir artifacts/islamic-exam-1447-final
      - name: Live HEAD guard before semantic finalization
        run: |
          git fetch origin content/corpus-inventory-20260914
          LIVE="$(git rev-parse origin/content/corpus-inventory-20260914)"
          HERE="$(git rev-parse HEAD)"
          echo "live=$LIVE checkout=$HERE"
          test "$LIVE" = "$HERE"
      - name: Finalize source-local exam boundaries
        run: python content-staging/tools/reconstruct_islamic_exam_1447.py
      - name: Record reconstruction checkpoint
        run: python content-staging/tools/record_islamic_exam_1447_checkpoint.py
      - name: Validate finalized reconstruction and global invariants
        run: |
          python -m json.tool content-staging/reconstruction/technical/f25891fe-ea52-481b-baf2-ff4764c79bde.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/f25891fe-ea52-481b-baf2-ff4764c79bde-discovery.json >/dev/null
          python -m json.tool content-staging/reconstruction/exams/source-groups/f25891fe-ea52-481b-baf2-ff4764c79bde.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          sid='f25891fe-ea52-481b-baf2-ff4764c79bde'
          t=json.loads(Path(f'content-staging/reconstruction/technical/{sid}.json').read_text())
          r=json.loads(Path(f'content-staging/reconstruction/exams/source-groups/{sid}.json').read_text())
          c=t['checks']
          assert c['existing_files']==c['readable_images']==c['byte_size_matches']==c['sha256_matches']==c['mime_matches']==93
          assert len(t['duplicate_sha256_groups_within_subject'])==6
          assert r['source_blocks_reviewed']==r['verified_source_occurrence_count']==r['individual_exam_model_count']==31
          assert r['finalized_exam_page_count']==93 and r['review_required_page_count']==0
          assert r['correction_sheet_candidate_count']==31 and r['verified_answer_key_count']==0
          assert r['duplicate_sha256_groups_within_source']==6
          assert len(r['models'])==31
          for i,m in enumerate(r['models'],1):
              first=(i-1)*3+1
              assert m['ordered_page_numbers']==[first,first+1,first+2]
              assert m['question_pages']==[first,first+1]
              assert m['correction_sheet_candidate_page']==first+2
              assert m['answer_key']['status']=='NOT VERIFIED'
          q=r['question_mapping']; assert q['exam_linked_structural']==q['review_required']==q['unassigned_within_source']==0 and len(q['records'])==0
          master=json.loads(Path('content-staging/manifests/MASTER_CONTENT_MANIFEST.json').read_text())
          p=master['reconstruction_progress']
          assert p['lesson_linked_structural']+p['exam_linked_to_individual_model']+p['review_required']+p['unclassified']==25755
          assert p['raw_mutations']==p['unrelated_mutations']==p['new_imports']==p['new_publications']==0
          source=next(x for x in master['sources'] if x['id']==sid)
          assert source['review_status']=='processed_boundary_verified_duplicates_preserved_answer_keys_not_verified'
          assert source['exam_reconstruction']['individual_exam_models']==31
          print('ISLAMIC_1447_FINALIZATION_VERIFY_PASS')
          print(json.dumps({'progress':p},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: islamic-exam-1447-final-evidence
          path: |
            artifacts/islamic-exam-1447-final/
            content-staging/reconstruction/technical/f25891fe-ea52-481b-baf2-ff4764c79bde.json
            content-staging/reconstruction/exams/source-groups/f25891fe-ea52-481b-baf2-ff4764c79bde-discovery.json
            content-staging/reconstruction/exams/source-groups/f25891fe-ea52-481b-baf2-ff4764c79bde.json
          if-no-files-found: error
          retention-days: 14
      - name: Live HEAD guard before checkpoint write
        run: |
          git fetch origin content/corpus-inventory-20260914
          LIVE="$(git rev-parse origin/content/corpus-inventory-20260914)"
          HERE="$(git rev-parse HEAD)"
          echo "live=$LIVE checkout=$HERE"
          test "$LIVE" = "$HERE"
      - name: Commit finalized reconstruction checkpoint
        run: |
          git config user.name 'alwaslh-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content-staging/reconstruction/technical/f25891fe-ea52-481b-baf2-ff4764c79bde.json content-staging/reconstruction/exams/source-groups/f25891fe-ea52-481b-baf2-ff4764c79bde-discovery.json content-staging/reconstruction/exams/source-groups/f25891fe-ea52-481b-baf2-ff4764c79bde.json content-staging/manifests/MASTER_CONTENT_MANIFEST.json content-staging/CONTENT_REBUILD_EXECUTION_STATUS.md content-staging/CONTENT_REBUILD_HANDOFF.md content-staging/CONTENT_INVENTORY.md content-staging/CONTENT_VALIDATION_REPORT.md content-staging/CONTENT_IMPORT_REPORT.md content-staging/CONTENT_REBUILD_CONTINUATION_2026-09-14.md
          if git diff --cached --quiet; then echo 'Derived reports unchanged.'; exit 0; fi
          git commit -m 'content: finalize Islamic 1447 exam reconstruction [skip ci]'
          git push origin HEAD:content/corpus-inventory-20260914
